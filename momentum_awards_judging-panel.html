to the board. Circle of Life is fortunate to have Genee working here and representing us."}, {"id": "recfVhHwMQuVRA5lf", "name": "Chantal Leblanc", "title": "Coordinatrice, PAB", "company": "Bien Chez Soi Deux-Montagnes, Mirabel", "category": "Frontline Care", "votes": null, "reason": "Tous les jours, Chantal Leblanc guide les clients vers les services dont ils ont besoin. Elle prend le temps de leur parler et de bien comprendre leurs besoins. Par la suite, elle choisit avec bienveillance la bienveillante qui correspond parfaitement à chaque client.\n\nElle a le cœur à la bonne place : elle est énergique, toujours présente pour offrir du soutien et constamment de bonne humeur.\n\nCela fait maintenant six ans que Chantal aide un monsieur à domicile, et elle ne l’a jamais laissé tomber, même depuis qu’elle travaille au bureau."}, {"id": "rec4kX3hUFi69e611", "name": "FATIMA  AL KANFOUD", "title": "BIENVEILLANTE -PAB", "company": "Bien Chez Soi", "category": "Frontline Care", "votes": null, "reason": "Une Bienveillante qui prodigue des soins humains et qui collabore avec toute son équipe afin que la mission Bien Chez Soi continue."}, {"id": "rec61T7qbtnnDaOc2", "name": "Belyse   Kwizera", "title": "Bienveillante", "company": "Bien chez Soi Aylmer-Pontiac", "category": "Frontline Care", "votes": null, "reason": "Belyse se distingue par sa grande compétence, sa douceur et sa collaboration exemplaire. Elle joue un rôle clé dans la coordination des soins auprès des bénéficiaires, en travaillant efficacement avec différents professionnels de la santé.\nDans un contexte où plusieurs intervenants (physiothérapeute, ergothérapeute) étaient impliqués auprès d’une même cliente, Belyse a su assurer une communication fluide et des suivis rigoureux, contribuant à la cohérence et à la qualité des soins.\nSa capacité à collaborer et à communiquer fait d’elle une intervenante essentielle pour le bien-être des bénéficiaires."}, {"id": "recnOFqJDoojLTzYH", "name": "Alain  Brice Aboucou", "title": "Bienveillant", "company": "Bien chez Soi Aylmer-Pontiac", "category": "Frontline Care", "votes": null, "reason": "Alain se distingue par son grand professionnalisme, son leadership naturel et sa fiabilité constante. Il inspire confiance autant auprès des bénéficiaires que des équipes.\nDans le cadre de son accompagnement auprès d’un M. habitant en résidence, les proches et le personnel de la résidence ont observé une amélioration notable de son bien-être global. Au-delà des soins, Alain apporte une présence humaine significative qui a un impact réel sur la qualité de vie du bénéficiaire.\nSon approche globale des soins fait de lui un pilier auprès des clients qu’il accompagne."}, {"id": "recrlhOxfbRIMRIXP", "name": "Bretta Uwamahoro", "title": "Bienveillante", "company": "Bien chez Soi Aylmer-Pontiac", "category": "Frontline Care", "votes": null, "reason": "Bretta se distingue par sa grande empathie, sa compassion et son dévouement exceptionnel. Elle développe des relations profondes avec les bénéficiaires, allant bien au-delà des soins de base.\nAuprès d’une cliente qu’elle accompagne régulièrement, elle a su créer un lien de confiance unique, au point de s’impliquer davantage lorsque nécessaire, démontrant un engagement sincère envers son bien-être.\nSa présence attentive et humaine contribue directement à améliorer la qualité de vie des personnes qu’elle accompagne."}, {"id": "recg8Yn3CrwSZ5au3", "name": "Falone  Musenga Lusamba", "title": "Bienveillante", "company": "Bien chez Soi Aylmer-Pontiac", "category": "Frontline Care", "votes": null, "reason": "Falone est reconnue pour son initiative, son empathie et son énergie positive. Elle entretient d’excellentes relations avec les bénéficiaires, leurs familles et l’équipe.\nGrâce à sa communication proactive et sa flexibilité, elle contribue à la stabilité des services et à une expérience client rassurante. Les familles soulignent particulièrement le sentiment de confiance qu’elle inspire.\nSon engagement et son esprit d’équipe font d’elle une employée exceptionnelle."}, {"id": "rec5E5wLumkUJxaQc", "name": "Dagmaly Santiago", "title": "Caregiver", "company": "Care Advantage Inc", "category": "Frontline Care", "votes": null, "reason": "Dagmaly is well-loved caregiver. She has been with our agency for over 5 years. She is a very dependable and caring caregiver. The family always speaks so highly of her, She drives an hour every morning to make sure her client gets the care they need and consistently follows EVV compliance. She shows up every day without fail and consistently provides great care. Her reliability and the positive feedback from the family say a lot about the kind of caregiver she is."}, {"id": "recqkD4wmHXK7flQN", "name": "Smriti Neupane", "title": "Personal Support Worker", "company": "Paramed", "category": "Frontline Care", "votes": null, "reason": "I’ve had the chance to work alongside Smriti over the past few months, and in that short time, she’s genuinely set a new standard for me when it comes to what great frontline care looks like.\n\nWe typically see each other once or twice a week while supporting a client who requires a two-person transfer, so I’ve been able to observe her closely in real, hands-on situations. What immediately stands out about Smriti is her natural kindness—she has a calm, gentle presence that puts people at ease almost instantly. What makes her exceptional is how seamlessly she pairs that warmth with a very high level of professionalism.\n\nShe is incredibly mindful in how she approaches care. Every interaction is respectful, intentional, and centered around the client’s comfort and dignity. She takes the time to communicate clearly, seek consent, and ensure the person she’s supporting feels safe and involved.\n\nThere was one moment that really stayed with me. During a shift, despite clearly asking for consent, she was criticized by the client for not doing so. Without becoming defensive or flustered, Smriti simply apologized and adjusted—becoming even more attentive, checking in more frequently, and continuing the care with patience, kindness, and a positive attitude.\n\nWhat I found most powerful was what happened after we left. Only once we were outside did she let her guard down, and it was clear the situation had affected her. It showed just how much she genuinely cares—not just about completing a task, but about being trusted and doing right by the people she supports. And yet, in the moment, she remained completely composed, ensuring neither the client nor their caregiver felt anything but respect and reassurance. I can honestly say I’ve never seen anyone demonstrate that level of emotional control and professionalism in a situation like that. It left a lasting impression on me.\n\nIn conversations we’ve had, Smriti has also shared some of the more difficult realities she has faced in this work, including inappropriate behaviour, unfair assumptions, and requests that go beyond what any caregiver should reasonably be expected to manage. What stood out to me was not just what she experienced, but how she handled it—with quiet dignity, professionalism, and the confidence to set clear boundaries when needed. She remains remarkably kind and thoughtful, without compromising her own respect or safety.\n\nBeyond her work with clients, Smriti is an incredible colleague. She is supportive, collaborative, and genuinely kind to those she works with. She goes out of her way to create a positive and respectful environment, making even difficult shifts feel manageable. Working with her is something I genuinely look forward to.\n\nSmriti is the kind of caregiver who brings steadiness into unpredictable situations. Her ability to remain kind without being passive, and professional without losing her humanity, is what sets her apart. In a role that demands both emotional strength and compassion, she delivers both—consistently and without recognition.\n\nShe is more than deserving of it."}, {"id": "recTRyvOcYx3aD44s", "name": "Ifeyinwa Inoma", "title": "Principal Nurse Consultant", "company": "Emfy Health Inc", "category": "Impact and Innovation", "votes": 286, "reason": "As the founder of Emfy Health, I am seeking nomination under the Impact & Innovation category in recognition of building a nurse-led, community-centred healthcare model that directly addresses critical gaps in access, continuity, and quality of care. \n\nI established Emfy Health in response to what I repeatedly witnessed in practice: patients with wounds, foot complications, ostomy needs, and chronic illnesses experiencing long delays, fragmented services, and preventable deterioration simply because specialty care was not easily accessible. Rather than accept this systemic barrier, I designed a mobile and hybrid care model that brings advanced nursing services directly to patients; at home, in long-term care, and in community settings. \n\nMy impact is demonstrated through: \n\nImproving Access to Specialized Care: I created a service that removes traditional barriers such as transportation, waitlists, and mobility limitations by delivering evidence-based clinical care directly to patients. This approach particularly benefits seniors, individuals with disabilities, and those managing complex chronic conditions. \n\nInnovating Nurse-Led Healthcare Delivery: Emfy Health operates on a framework that maximizes scope of practice, supports early intervention, and reduces unnecessary emergency department visits and hospitalizations. This model demonstrates how advanced nursing leadership can improve outcomes while reducing system burden. \n\nIntegrating Clinical Excellence with Business Innovation: I built Emfy Health as a sustainable healthcare enterprise, combining clinical expertise with operational systems, digital coordination, and scalable service delivery. This entrepreneurial approach proves that high-quality care and fiscal responsibility can coexist, creating a replicable model for future community health services. \n\nStrengthening Healthcare Capacity: Beyond direct patient care, I provide education and support to frontline staff in partner facilities, improving wound prevention practices, continence management, and early identification of complications, multiplying impact beyond individual encounters. \n\nChampioning Preventive, Patient-Centred Care: My model emphasizes prevention, education, and empowerment, helping patients understand their conditions, participate actively in their care, and maintain independence wherever possible. This reduces complications and improves quality of life. \n\nAdvancing Health Equity Through Innovation: By designing services around patient realities, not institutional convenience, I have created a flexible, culturally responsive care model that reaches underserved populations and promotes equitable access to healthcare. \n\nThrough Emfy Health, I have demonstrated how nurse-led innovation can reshape community healthcare delivery. My work integrates clinical leadership, entrepreneurship, and system-level thinking to improve access, enhance outcomes, and support sustainability. \n\nThis nomination reflects not only the creation of a healthcare business, but the development of a meaningful solution to real-world healthcare challenges, driven by compassion, evidence, and innovation."}, {"id": "rec7tmUcSSRWCyIHA", "name": "Brandis Moran", "title": "Vice President of Operations and Strategic Management", "company": "Integirty HHS", "category": "Impact and Innovation", "votes": 129, "reason": "I would like to take a moment to formally nominate one of Integrity’s most outstanding leaders, Brandis Moran.\nBrandis has been a dedicated member of the Integrity team for over 10 years. Her leadership truly came to the forefront in 2021 when she was selected to spearhead the rollout of AlayaCare and stepped into the role of Systems Administrator. In this capacity, she not only mastered a complex new platform herself, but also successfully trained seven branch managers and numerous care coordinators. This was no small accomplishment, particularly in the face of significant resistance to change. Despite these challenges, Brandis demonstrated exceptional resilience and leadership as she then rolled out the AlayaCare App to over 800 caregivers.\nThroughout this process, Brandis consistently conducted herself with professionalism, grace, determination, and unwavering loyalty.\nSince the initial rollout, Brandis is now Vice President of Operations and Strategic Management and has remained instrumental in implementing ongoing updates and innovations from AlayaCare. She has been a strong advocate for continuous improvement, actively participating in pilot projects, contributing to AlayaCare case studies, and representing Integrity in speaking engagements such as Better Outcomes. Her leadership was key in advancing initiatives such as the Connector, CI Suite, and most recently, AlayaFlow.\nBrandis’s forward-thinking mindset and commitment to innovation played a significant role in Integrity receiving the AlayaCare Early Adopter Award last year. She continually seeks opportunities to streamline processes and enhance the experience for both caregivers and clients.\nBrandis Moran exemplifies leadership, innovation, and dedication, and I am proud to nominate her."}, {"id": "recrAdnKoKEerDlwb", "name": "Eric Dalton", "title": "Vice President", "company": "Angels on Call Homecare", "category": "Impact and Innovation", "votes": 54, "reason": "Eric Dalton is nominated for the Impact & Innovation award for his leadership in redefining how specialized neurological and dementia care can be delivered in the home. As Vice President of Angels on Call Homecare, Eric has helped transform a family-founded agency into a nationally recognized model for complex home-based care while advancing standards across the industry.\n\nRecognizing that traditional homecare models were not designed to meet the complex needs of individuals living with Dementia and Parkinson’s disease, Eric set out to build a new framework one that integrates specialized caregiver training, clinical oversight, and innovative service design. Under his leadership, Angels on Call became the first homecare provider in the United States Accredited in Certified Parkinson’s Disease Care (CPDC™) and the first Accredited healthcare organization in New York to achieve Purple Flag Dementia Care Accreditation. The organization has also been recognized as a Community Partner in Parkinson’s Care (CPPC) by the Parkinson’s Foundation and as an Age-Friendly Health System – Committed to Care Excellence through the Institute for Healthcare Improvement, reinforcing its commitment to advancing evidence-informed home-based care.\n\nEric has pioneered several innovative programs designed to restore dignity, engagement, and quality of life for individuals living with cognitive decline. These include the Memory Care Angel (MCA) program, the Guardian Angel RN initiative, and Timeless Beauty Spa—the first in-home beauty spa program designed specifically for individuals living with dementia and cognitive impairment. The program is delivered by a Licensed Practical Nurse who is also a licensed cosmetologist and dementia-certified professional, ensuring services are provided with both clinical understanding and therapeutic sensitivity. This unique combination helps restore important rituals of personal care, confidence, and identity that are often lost during illness.\n\nInnovation for Eric also extends beyond direct care to strengthening the caregiving ecosystem for families. He launched Angels Embrace, a free support group providing education, guidance, and connection for families navigating Dementia and Parkinson’s disease. The program creates a trusted space where caregivers and loved ones can share experiences, learn practical strategies, and access reliable resources while navigating complex care journeys.\n\nEric is equally committed to advancing the future of the caregiving workforce. He led the development of a licensed PCA training school that provides free certification opportunities, expanding the healthcare workforce while creating meaningful career pathways for individuals entering the field.\n\nUnder Eric’s leadership, Angels on Call has also implemented data-driven quality monitoring systems that track clinical indicators such as falls, infections, and safety outcomes across the care population. These efforts demonstrate how structured training, clinical oversight, and specialized programming can contribute to safer home environments, with caregiver supervised care associated with significantly lower fall incidence compared to overall client exposure.\n\nThrough this work, Eric Dalton is not only improving outcomes for individuals and families today he is helping shape a future in which specialized dementia and neurological care can be safely and effectively delivered at home, expanding what is possible for home-based healthcare across the industry."}, {"id": "rechUDcOPkPpYVEeh", "name": "Jeet Shweta SHANGARI", "title": "Operations Manager & CCM", "company": "BrightStarCare Acton/Andover & Lowell", "category": "Impact and Innovation", "votes": 43, "reason": "BrightStar Care Acton/Andover & Lowell is proud to be considered for the Impact & Innovation Award for the transformative care and forward-thinking practices our team brings to home and hospice care. Our 80+ licensed nurses and professional caregivers consistently deliver 5-star–rated care to the most medically complex and vulnerable clients across 12+ towns.\n\nWhat sets us apart is not only clinical excellence but also innovation in how we deliver care. BrightStar Care has embraced advanced technology and AI tools to improve efficiency, safety, and outcomes. Staff document care electronically, replacing traditional paper records, and use AI-enabled tools to monitor patient health, track medications, and manage complex clinical needs such as wound care, oxygen therapy, ventilator management, respiratory care, and palliative support. These innovations allow our nurses and caregivers to spend more time providing direct care, improving productivity, and ensuring precision in every intervention.\n\nOur commitment to innovation extends to continuous staff education. Through programs like Relias training, ongoing clinical workshops, and AI/technology-focused learning sessions, we enhance staff expertise in home care, infection prevention, wound management, and specialized clinical skills. This culture of continuous learning ensures that our team remains at the forefront of home health care, equipped to manage complex cases with confidence and compassion.\n\nBeyond direct care, we leverage innovation to empower our community. Free educational series on AI, technology, fall-risk prevention, and home care, along with free wellness clinics, yoga sessions, and music and piano events, help families and seniors stay informed, safe, and engaged. By combining cutting-edge clinical tools with community-centered programs, we not only impact the lives of individual clients but strengthen the overall health, safety, and well-being of the Boston-area community.\n\nBrightStar Care Acton/Andover & Lowell exemplifies how innovation, technology, and compassionate care can intersect to transform home and hospice care—making a measurable difference in patients’ lives and the communities we serve.\n\nWebsite: https://www.brightstarcare.com/locations/acton-andover-lowell/\n\nCommunity Impact & Free Programs: https://www.brightstarcare.com/locations/acton-andover-lowell/about-us/blog/caring-beyond-the-home-how-brightstar-care-tewksbury-is-educating-empowering-our-local-community/"}, {"id": "recp5ZXicuACMQ6jm", "name": "Eileen Hedrick, RN, BSHA", "title": "Nurse Founder", "company": "Martha's Hands Home Care & Wellness Services", "category": "Impact and Innovation", "votes": 41, "reason": "Eileen McCaffrey Hedrick started with a mission statement.  It was the Mother Teresa quote, \"We serve with our hands, love with our hearts and seek the face of our Creator in those we serve.\"  She told her family, if I am going to start a Home Care Agency, it must be built around this statement.\n\nSince 1997, Martha's Hands was founded on the principles of Compassion and Excellence in Home Care.  Compassion was the Care Ministry model.  As discussed above, Eileen founded Martha's Hands based on that mission statement of Love through Service.  Being a Care Ministry, we reflect back on our Mission Statement in everything we do.  The people we attract, Caregivers and Office Support Team, embody this mission.  As proof: during COVID, the average home care agency lost 20% of their care team in the first 90 days.  Martha's Hands only lost 5%.  They were dedicated to serving others, especially in challenging times.\n\nExcellence refers to our unique Nurse Care Manager model.  Even though Missouri is not a licensed state, Eileen believed that everyone deserves a nurse.  Having a team of highly skilled, compassionate nurses to oversee the care for all our clients and support our caregivers, Martha's Hands is recognized as the gold standard for home care in St. Louis.  As proof: Martha's Hands is the only Private Duty Home Care Provider on all the major hospital systems Preferred Provider List.  As proof: since 2021, Martha's Hands has a 100% fill rate for their shifts.\n\nEileen's innovative structure embodied by Compassion (Care Ministry) and Excellence (Nurse Care Manager model), has enabled Martha's Hands to be a national leader in home care."}, {"id": "reczoBnSgyGPB6H87", "name": "Jeff Salter", "title": "founder and CEO", "company": "Caring Senior Service", "category": "Impact and Innovation", "votes": 26, "reason": "Jeff Salter has been at the forefront of innovation in home care by consistently advancing how technology can improve the delivery of care. As founder and CEO of Caring Senior Service, he has spent years building a model that integrates digital tools into every aspect of the care experience, strengthening communication, coordination, and outcomes for seniors and their families.\n\nLong before the recent surge in interest around artificial intelligence, Jeff recognized that the future of home care would depend on the thoughtful use of technology. Through the development of proprietary systems like Tendio, he helped address one of the industry’s most persistent challenges: fragmented operations. By connecting care planning, scheduling, communication, and documentation into a unified experience, his approach has enabled care teams to operate more efficiently while maintaining a high standard of personalized service.\n\nBuilding on this foundation, Jeff has embraced artificial intelligence as the next step in improving care delivery. Rather than treating AI as a standalone solution, he has integrated it into existing workflows to enhance decision-making, streamline communication, and reduce administrative burden. This allows caregivers to spend less time navigating systems and more time focused on meaningful interactions with clients.\n\nThe impact of this approach is evident across the care ecosystem. Care teams are better equipped to respond quickly to changing client needs, families have greater visibility into care, and operations are able to scale more effectively without sacrificing quality. By combining long-standing technology infrastructure with emerging AI capabilities, Jeff has created a model that supports both efficiency and consistency in care delivery.\n\nWhat distinguishes Jeff’s leadership is his long-term vision. He has not approached innovation as a series of isolated tools, but as a continuous effort to improve how care is delivered. His early investment in technology laid the groundwork for more advanced capabilities today, allowing his organization to adopt AI in a way that is practical, responsible, and aligned with the needs of caregivers and clients.\n\nThrough his leadership, Jeff Salter has helped shape a more modern, connected approach to home care, demonstrating that meaningful innovation comes not from a single breakthrough, but from a sustained commitment to improving the way care is delivered over time."}, {"id": "recFwogJLwEpHpZHM", "name": "Robert Stanley", "title": "CEO and Founder", "company": "CHAH AI Care", "category": "Impact and Innovation", "votes": 24, "reason": "Rob has been at the front of Canada's innovation for the home care sector, with his tech and innovation arm: CHAH Technology.   Building upon his successful home care company (Stay at Home Nursing), Rob is now building a new, innovative integrated care model that include remote patient monitoring (powered by AI).  This offered is tightly integrated with AlayaCare for the overall workflow and response to AI generated alerts.  This is building and creating new IP and leadership for Canada."}, {"id": "recdufCLSa13mGvJ3", "name": "Cassandra Bernard", "title": "Clinical Nursing Supervisor", "company": "Arizona Home Care", "category": "Impact and Innovation", "votes": 22, "reason": "I am pleased to nominate Cassandra Bernard for recognition as an outstanding Nurse and Clinical Supervisor. She consistently exemplifies excellence in both clinical practice and leadership.\n\nHer clinical knowledge is exceptional. She is thorough in her assessments, thoughtful in her decision-making, and consistently ensures that patients receive safe, high-quality care. Her attention to detail and strong clinical judgment make her a trusted resource for both patients and staff.\n\nAs a Clinical Supervisor, she goes above and beyond to support and educate fellow nurses. She prioritizes mentorship, ensuring that team members feel confident, competent, and supported in their roles. She is an excellent trainer who takes the time to teach, explain, and guide with patience and professionalism. Her commitment to ongoing education strengthens not only individual nurses but the entire team.\n\nHer communication skills are outstanding. She advocates effectively for both patients and nurses, ensuring concerns are heard and addressed appropriately. She fosters a culture of collaboration, respect, and accountability. Her dedication to customer service is evident in the way she interacts with patients and families—always compassionate and responsive.\n\nIn addition to her clinical and leadership strengths, she is incredibly hardworking and innovative. She is always seeking better processes, improved outcomes, and new ways to support her team. She consistently goes above and beyond expectations, demonstrating reliability, initiative, and a true passion for nursing.\n\nShe is a role model, a mentor, and a strong advocate for quality care. I wholeheartedly recommend her for this recognition, as she truly embodies excellence in nursing leadership and patient care."}, {"id": "recmPyxejNUZEzqud", "name": "Marie Boursiquot", "title": "Chief Executive Officer", "company": "Ottawa Home Care Associates Inc.", "category": "Impact and Innovation", "votes": 17, "reason": "Marie Boursiquot, Chief Executive Officer, is a visionary and compassionate leader dedicated to building a workplace where people feel valued, supported, and inspired. With a strong belief that employees are the heart of any organization, she prioritizes creating a positive and respectful work environment where every individual can thrive. Marie is deeply committed to fostering a culture of appreciation, regularly recognizing the contributions and achievements of her team members.\n\nShe champions diversity and inclusion, ensuring that all voices are heard and respected regardless of background, culture, or experience. Under her leadership, the organization promotes equity, encourages collaboration, and celebrates the unique strengths each employee brings to the table. Marie believes that a diverse workforce drives innovation and strengthens the quality of care and service provided.\n\nHer leadership style is rooted in empathy, transparency, and open communication. She actively listens to her team, supports their professional growth, and ensures they have the resources they need to succeed. By cultivating trust and mutual respect, Marie has built a strong, unified team that is passionate about making a difference. Her dedication continues to shape a workplace culture that is inclusive, empowering, and people-centered."}, {"id": "recoMeKjfafrPAlty", "name": "Kam Muthulingam", "title": "Director of Information Technology Solutions", "company": "KidsAbility Centre for Child for Child Development", "category": "Impact and Innovation", "votes": 9, "reason": "The Problem Worth Solving \n\nFor caregivers already carrying the emotional weight of a child's diagnosis, the last thing they should have to manage is a phone queue. Yet that was the reality: confirming or cancelling a therapy appointment meant a missed call, time on hold, and back-and-forth with clinical and administrative teams every single time. \n\nKidsAbility's team under the leadership of Kam Muthulingam saw this friction and asked a different question. Instead of \"how do we remind families?\", they asked: \"how do we make it effortless for families to respond?\"  \n\nWhat began as a straightforward question became something far more significant: a reimagining of how a healthcare organization communicates with the families it serves. By harnessing the AlayaCare Connector tool, the team built a personalized, automated reminder system that doesn't just notify families. It empowers them to respond, confirm, and cancel in seconds, directly from their phone or inbox, without ever calling the Centre. \n\nThe result is a solution that is quietly transformative. Families experience less friction and more control. Clinical and administrative staff gain real-time visibility and fewer manual tasks. And KidsAbility moves closer to the kind of modern, responsive care delivery that families deserve. \n\n \n\n \n\nPutting Families First \n\nThe solution redesigned appointment communication from the ground up replacing one-way, passive reminders with two-way, actionable messages that meet caregivers where they are. \n\nThrough personalized email and SMS reminders, caregivers can now confirm or cancel directly from the message itself — no call required, no back-and-forth. Communication is sent to all primary contacts with consistent, clear language, eliminating confusion and duplication across households. \n\nWithin the first month of launch, 70% of families confirmed their appointments directly through the reminder message — displacing those calls entirely and giving caregivers genuine control over their child's schedule. \n\nThis is not a minor convenience improvement. For a family navigating multiple therapies across occupational, speech, and physiotherapy disciplines, this change removes a recurring source of administrative burden from an already demanding caregiving role. \n\n \n\nThe Innovation Behind the Experience \n\nWhat feels effortless to a caregiver is the result of a highly sophisticated, carefully designed workflow built within the AlayaCare Connector tool. This was not a configuration exercise; it required the team to architect for new logic, design decision trees, and build integration pathways that did not previously exist within the platform. \n\nKey engineering decisions that made this possible: \n\nIntelligent timing. Automated two-stage reminder cadence, with messages sent 5 business days and again 24 hours before each appointment timed to maximize response rates and minimize last-minute disruptions. \n\nMulti-discipline sync. Cross-discipline calendar synchronization, where a single caregiver response updates all clinicians, schedules simultaneously eliminating siloed communication and ensuring coordinated care across the care team. \n\nLive system updates. Real-time AlayaCare integration with connector, routing confirmations and cancellations directly into the Alayacare without any manual intervention, preserving data integrity at the point of response. \n\nInstant staff alerts. Immediate clinician notification upon any schedule change enabling faster backfilling, improved capacity utilization, and proactive waitlist management. \n\nSafety-first design. Built-in custody safeguards, protecting sensitive family situations by controlling which contacts receive communications a non-trivial design challenge with real clinical and legal implications. \n\nCaregiver autonomy. Integrated unsubscribe functionality, respecting caregiver communication preferences while maintaining compliance and organizational trust. \n\nThe result is a seamless front-end experience powered by robust, real-world-ready automation demonstrating that thoughtful technical design and client-centered care are not competing priorities. \n\n \n\nMeasurable Impact \n\nCurrently live within one of KidsAbility's major in-centre programs, this initiative is already delivering results across three dimensions: \n\nCaregiver experience: Families gain autonomy and time back managing appointments on their schedule, not ours. \n\nOperational efficiency: Administrative and clinical staff benefit from reduced inbound call volume, real-time schedule visibility, and faster response to cancellations. \n\nCapacity optimization: Immediate notification of cancellations enables same-day backfilling, turning what was previously lost appointment time into recovered access for families on waitlists. \n\n70% direct confirmation rate in month one, a strong early signal that families are engaging with the system exactly as intended. \n\n \n\nWhat Comes Next \n\nThis project was designed to scale. The architecture now in place within AlayaCare Connector is adaptable across all KidsAbility programs and communication types positioning the organization to extend this seamless experience to every family we serve, regardless of discipline or program location. \n\nBy developing, piloting, and championing this solution from within, the KidsAbility team has done more than solving an operational problem. They have redefined what modern, family-centered care delivery looks like and built the infrastructure to make it the standard. \n\nThat is the spirit of innovation this award recognizes."}, {"id": "recXQydSH4x4SSiG0", "name": "Sonja Collomb", "title": "Supervisor, Home Services, Administration", "company": "Lethbridge Family Services", "category": "Impact and Innovation", "votes": 1, "reason": "Sonja has led the way in transforming new ideas and methods into practical solutions that have delivered significant value to our Home Services department. The positive effects on our employees and clients are evident, thanks to a platform that offers clarity, accuracy, and user-friendliness. This enables us to analyze our data more effectively and improve the community initiatives we undertake. As we continue to implement, Sonja has remained tireless and dedicated to improving service delivery."}, {"id": "recSRdp3J06gCoz9w", "name": "Tiffany Thompson", "title": "Nurse", "company": "Nurse on Wheels Inc", "category": "Impact and Innovation", "votes": 1, "reason": "Nurse on wheels as a company cares about their caregivers and clients as equals. They go above and beyond to ensure the client is more than a payee, they are family. They do meal prep, home clean, personal care, and help with daily activities. On top of that, they also stay and converse, walk, play games, watch tv and more."}, {"id": "recFg0HD0jsXvAtke", "name": "Ashley McLellan", "title": "Directrice Générale", "company": "Bien Chez Soi", "category": "Impact and Innovation", "votes": 1, "reason": "Ashley pilote l’innovation technologique chez Bien Chez Soi depuis plus de 7 ans, avec une vision claire : utiliser la technologie pour redonner du temps à l’humain.\n\nAujourd’hui, elle dirige les projets en intelligence artificielle en collaboration étroite avec l’équipe d’AlayaCare, contribuant activement à faire évoluer les pratiques du secteur des soins à domicile, au Québec et au-delà.\n\nSon approche ne vise pas simplement à améliorer les systèmes existants, mais à les repenser. Elle travaille à réduire la charge administrative et opérationnelle afin de permettre aux équipes de consacrer davantage de temps à ce qui compte réellement : la relation avec les bénéficiaires et la présence humaine des bienveillants.\n\nCe qui distingue particulièrement Ashley, c’est sa capacité à porter une vision qui dépasse les intérêts organisationnels. Elle propose et pilote des initiatives qui ne répondent pas uniquement aux réalités de Bien Chez Soi, mais qui visent à faire progresser l’ensemble de l’industrie des soins à domicile. Elle s’implique dans des projets et des orientations qui contribuent au développement de pratiques plus efficaces, plus humaines et plus durables à grande échelle.\n\nGrâce à son leadership, Bien Chez Soi s’appuie sur l’innovation comme levier concret de croissance et de transformation, tout en participant activement à l’évolution du secteur. Elle contribue à bâtir un modèle de soins plus efficace, plus humain et mieux adapté aux réalités actuelles et futures des personnes en perte d’autonomie.\n\nAshley incarne une nouvelle génération de leaders en soins à domicile : capables d’allier technologie, performance et humanité pour faire évoluer durablement l’industrie."}, {"id": "recqv5dKEZGtTYptI", "name": "Barbi Davis", "title": "Designated Director", "company": "Midway Homes Adult Care", "category": "Impact and Innovation", "votes": 0, "reason": "Barbi exemplifies what it means to lead with heart, integrity, and unwavering dedication on the front lines of care. Her impact reaches far beyond daily operations—she transforms the lives of the individuals she supports, uplifts her staff, and elevates the standards of her organization through consistent excellence and innovation.\nFrontline Excellence & Compassionate Care\nBarbi is deeply committed to ensuring every individual receives respectful, dignified, person centered care. She consistently advocates for the rights, needs, and well being of those she serves, ensuring their voices are heard, respected, and protected. Her actions reflect the belief that every person—regardless of circumstance—deserves to feel safe, valued, and supported.\nOperational Leadership Rooted in Values\nThrough her strong work ethic and exceptional organizational insight, Barbi maintains operational excellence while never compromising on her core values. She bridges company standards with human dignity, setting a powerful example of how compassionate care and regulatory compliance work hand in hand. Her meticulous oversight strengthens service quality and ensures that both individuals and staff can thrive in a safe, structured environment.\nExecutive Leadership, Teaching, and Talent Development\nBarbi brings a leadership style defined by patience, clarity, and empowerment. She goes above and beyond to guide, train, and mentor her team—giving staff the knowledge, tools, and confidence they need to succeed. Her open door approach fosters trust, psychological safety, and professional growth. Staff routinely express feeling comfortable coming to her with questions, challenges, and ideas because they know they will be met with respect and solutions.\nAdvocacy, Innovation, and Courage\nA tireless advocate, Barbi consistently stands up for the individuals in her care. She navigates complex systems, collaborates with partners, and pushes for changes that improve quality of life. Her willingness to think creatively, challenge barriers, and implement person centered solutions has resulted in meaningful improvements for both the individuals she serves and the teams she leads.\nWhy Barbi Should Be Honored\nHer work is not just a job—it is a mission. Her leadership inspires transformation, her advocacy drives progress, and her compassion restores dignity. The impact of her dedication is felt organization wide and radiates outward into the community she serves.\nFor her unwavering commitment, her innovative approach to care, and her powerful, values driven leadership, Barbi Davis is not only deserving of this award—she embodies it."}, {"id": "recaGHgX9jEWfpecW", "name": "Melanie Hval", "title": "Director", "company": "Compass Rose Care", "category": "Impact and Innovation", "votes": null, "reason": "Melanie is the driving force behind Compass Rose Care’s impact and innovation in home based care. She has redefined what personalized, relationship centered care looks like by building systems that prioritize dignity, consistency, and clinical excellence in the home. Under her leadership, Compass Rose Care has elevated standards for caregiver matching, care planning, and family communication, while fostering a culture where caregivers feel valued and empowered. Melanie does not simply respond to gaps in the system, she redesigns them. Her ability to blend compassionate nursing leadership with entrepreneurial vision has created measurable outcomes for clients and meaningful career pathways for caregivers. She exemplifies momentum in action and continues to push the industry forward with integrity, creativity, and purpose."}, {"id": "recDbAk1FCFHJpBle", "name": "Hamerti Melka", "title": "Director of Operations", "company": "TLC Nursing and Home Care Services Ltd", "category": "Impact and Innovation", "votes": null, "reason": "Hamerti Melka, better known as Amie, has spent more than a decade demonstrating that home‑based care in Newfoundland and Labrador is not a service. It is infrastructure.\n\nUnder her operational leadership, TLC Nursing and Home Care Services experienced significant growth. Which was achieved through a global pandemic, through one of the most severe workforce shortages, and in the country’s oldest province. That spanned five regions, from urban centres to rural communities, proving that scale and quality are not mutually exclusive in home care.\n\nThrough her active engagement with the Home Care Association of Newfoundland and Labrador, Amie worked directly on a provincial overtime policy committee, advocating for protections that allow home care workers to remain in the profession. Stable workers enable consistent care. Consistent care builds trust. In a province facing a historic workforce crisis, trust is not a soft outcome, it is the difference between a client remaining safely at home and a system pushed into crisis.\nUnder her leadership, TLC achieved accreditation and was recognized by ANC as an Outstanding Employer. Across Newfoundland, an extended team of home support workers and coordinators from Corner Brook to Stephenville, Grand Falls to Rocky Harbour, Port aux Basques to St. John’s deliver on the promise of home‑based care every single day. Amie also serves as an Executive Board Member of the Home Care Association, contributing her operational insight at the provincial level.\n\nAmie came to Canada as a refugee. She built her career in a province where she is, and remains, the only Black woman at this level of home care leadership. She did not wait for a seat at the table she earned one by building trust within the communities she serves.\n\nGrounded in occupational health and safety and public health, and with a growing focus on how technology and AI can advance client care outcomes, Amie brings both deep operational expertise and forward‑looking vision to an industry in transformation.\n\nShe leads with precision, with advocacy, and with an unwavering belief that home care is not a service it is infrastructure.\n\nAnd infrastructure requires leaders willing to fight for it at every level. When done right, it delivers dignity, stability, and the very best of humanity to those who need it most."}, {"id": "receS36rz2Dw68Uc0", "name": "Michelle Marshall", "title": "Specialty Infusion Program Coordinator", "company": "Palmetto Infusion Services", "category": "Impact and Innovation", "votes": null, "reason": "I am proud to nominate Michelle for the Momentum Award because she exemplifies what it means to lead meaningful change in home‑based care and to expand access without compromising quality, safety, or outcomes.\nMichelle has been instrumental in the successful launch and growth of Palmetto Infusion’s Specialty Home Infusion program. At a time when healthcare is rapidly shifting toward alternative sites of care, she helped turn strategy into reality by building the operational and clinical foundation required to safely deliver complex infusion therapies in the home. Her work has directly enabled more patients to receive high‑acuity care in a cost‑effective, convenient setting while maintaining the clinical rigor traditionally associated with institutional environments.\nWhat makes Michelle’s impact particularly compelling is her ability to lead change across multiple dimensions at once. She has collaborated closely with stakeholders across clinical, intake, sales, operations, and technology teams to ensure processes were clearly defined, communicated, and operationalized. These efforts reduced ambiguity, improved coordination, and removed barriers that often delay or limit patient access to home infusion services.\nMichelle partnered with the sales team to create reporting processes that provide transparency and reassurance to referring providers, ensuring they know when patients have received their medication and that therapy is progressing as intended. In parallel, she worked hand in hand with the intake department to ensure all documentation required for payer authorization is obtained efficiently, helping prevent avoidable delays that can interrupt care.\nShe has also contributed meaningfully to Palmetto’s technology evolution. Michelle has participated in integration planning for the organization’s new EMR and is actively involved as Palmetto continues implementing the AlayaCare patient management system and its Marketplace capabilities. Her involvement has focused on ensuring these tools support real‑world workflows, improve visibility across the care team, and ultimately enable scalable growth that expands access to home‑based care across multiple states.\nPerhaps most importantly, Michelle has never lost sight of the patient experience. She conducts welcome calls with specialty infusion patients, taking time to explain the home infusion process, set expectations, and build trust during what is often a stressful transition in care. She completes environmental assessments to ensure homes are appropriate for infusion therapy, reinforcing both safety and confidence in the alternative site of care model.\nAcross her territory, Michelle coordinates care with contracted agencies spanning multiple states to ensure patients receive the therapies they need, when they need them. Her oversight promotes compliance, continuity, and positive clinical outcomes, even in complex and resource‑challenged environments.\nMichelle is a true solutions‑driven leader. She consistently looks beyond obstacles to find practical, patient‑centered ways to improve access, simplify processes, and elevate care delivery. Through her leadership, she has helped shape a specialty home infusion program that is scalable, clinically sound, and deeply aligned with the needs of patients, providers, and caregivers.\nFor her role in expanding access to high‑quality home‑based care, leading operational and technological change, and setting a higher standard for specialty infusion services in the home, Michelle is exceptionally deserving of the Momentum Award."}, {"id": "recV8EYBAaXd7mQrd", "name": "Komal Batra", "title": "Human Resources Manager", "company": "Ottawa Home Care", "category": "Operational Excellence", "votes": 543, "reason": "I am pleased to nominate Komal Batra, HR Manager at Ottawa Home Care, for the Operational Excellence recognition. Komal has demonstrated outstanding leadership and dedication in strengthening human resources operations while ensuring smooth and efficient organizational processes.\n\nThrough her strong organizational skills and proactive approach, Komal has significantly improved HR operations including recruitment, onboarding, staff coordination, and policy implementation. She ensures that all administrative and operational processes are carried out efficiently, allowing both office staff and healthcare professionals to perform their roles effectively.\n\nKomal is known for her ability to create structured systems that support clear communication, accountability, and compliance within the organization. She consistently works to streamline procedures, improve documentation practices, and ensure that workplace policies are implemented fairly and transparently.\n\nBeyond operational management, Komal is deeply committed to supporting employees and fostering a positive workplace environment. She approaches challenges with professionalism and empathy, ensuring that staff feel heard, supported, and motivated.\n\nHer leadership and dedication have played a key role in maintaining high operational standards and enabling the organization to deliver reliable, quality care services to the community. For her commitment to efficiency, professionalism, and continuous improvement, I strongly recommend Komal Batra for the Operational Excellence nomination."}, {"id": "recPLNmOaFwP2UJdM", "name": "Sumi Karim", "title": "System Communication Scheduler", "company": "Ottawa Home Care Associates Inc.", "category": "Operational Excellence", "votes": 447, "reason": "As CEO, I am pleased to recognize our Scheduler for their exceptional coordination, dedication, and reliability. Managing schedules in a dynamic environment is no easy task, yet they consistently ensure that every shift is covered efficiently and smoothly. Their attention to detail, strong organizational skills, and ability to respond quickly to last-minute changes are truly commendable.\n\nThey play a crucial role in supporting both our staff and clients, ensuring continuity of care and operational success. Their calm approach, teamwork, and commitment to excellence make them an invaluable part of our organization. It is with great appreciation that I recognize their outstanding contribution."}, {"id": "recsSrVo8Cp6MLw9F", "name": "Lauren  Malik", "title": "Agency Director", "company": "Caring Senior Service in Irvine, California", "category": "Operational Excellence", "votes": 107, "reason": "Lauren Malik demonstrates operational excellence through her ability to design, scale, and sustain high-performing care operations in a fast-growth environment. As Agency Director of Caring Senior Service in Irvine, she has built one of the top-performing franchises in the national network, growing the agency from startup to $1.2 million in its first year, $2.2 million in its second, and on pace to exceed $3 million in year three. \n\nThis level of growth is supported by a disciplined operational framework. Lauren has recruited and developed a workforce of more than 150 caregivers while overseeing care for more than 200 active clients. She has implemented scalable systems for scheduling, staffing, and communication that allow the organization to expand without compromising consistency or quality of care. \n\nHer leadership is defined by control in complexity. She manages high-volume coordination, staffing variability, and evolving client needs with structure and clarity, ensuring that both caregivers and families experience reliability at every stage of care. Caregivers consistently note her responsiveness and organization, while families value her ability to navigate challenging situations with confidence and professionalism. \n\nLauren also demonstrates an ability to translate insight into action. Recognizing the impact of social isolation, she developed the “Senior Smiles” initiative to provide connection and recognition for seniors without nearby family. The program has since influenced similar efforts across the broader organization, reflecting her ability to extend operational impact beyond her own office. \n\nLauren has created an operation that not only performs at a high level, but is built to sustain that performance as it grows. Her ability to bring structure to complexity and consistency to rapid expansion positions her as a leader whose impact extends beyond a single location and into the broader standard of home care delivery."}, {"id": "recU8aqqXTBMm6FHO", "name": "Morgan Kelley", "title": "Documentation Coordination Manager", "company": "AvevoRx", "category": "Operational Excellence", "votes": 103, "reason": "I am nominating Morgan for this award because she has made significant, measurable contributions to our organization throughout the AlayaCare integration and ongoing system development. In her role, she leads the team responsible for processing all nursing documentation and preparing it for billing. This includes document reconciliation, visit verification, payroll processing, and producing accurate cost‑reporting metrics for the organization.\nMorgan not only oversees her team but also actively monitors the AlayaCare platform itself to identify opportunities for process improvement and efficiency gains. She regularly collaborates with both our internal teams and AlayaCare representatives, using system‑generated data to drive workflow enhancements and strengthen our outcome reporting and metrics.\nAdditionally, Morgan has been an invaluable resource in training nursing staff—both within our organization and across partner agencies—on accurate documentation practices and effective use of AlayaCare. Her leadership, attention to detail, and commitment to continuous improvement have made a meaningful impact on our operations and overall success."}, {"id": "recFHP1a0oaqwJ42a", "name": "Brittani  Deuth", "title": "Agency Director", "company": "Caring Senior Service in Lakewood, Colorado", "category": "Operational Excellence", "votes": 50, "reason": "Brittani Deuth exemplifies operational excellence through her ability to build, stabilize, and elevate a home care agency while remaining deeply connected to both clients and caregivers. As Agency Director of Caring Senior Service in Lakewood, Colorado, she has played a central role in transforming the office from a small, early-stage operation into a high-performing, multi-million-dollar agency.\n\nBrittani’s career in home care began on the frontlines. Coming from a caregiving family and working directly with clients early in her career, she quickly demonstrated a natural ability to build trust and deliver exceptional care. Her impact was evident from the start, as she helped win over clients and families through her dedication and reliability, setting the tone for the kind of service the organization strives to provide.\n\nAs she transitioned into leadership, Brittani took on the challenge of building and managing a new office, often operating as the sole team member during its early stages. Through persistence, adaptability, and a hands-on approach, she guided the Lakewood location through its formative years and into sustained growth. Under her leadership, the office reached $2 million in annual billing and became a consistent performer within the organization’s Champions’ Circle.\n\nWhat distinguishes Brittani’s leadership is her commitment to both operational performance and team sustainability. She has been instrumental in developing and implementing programs that improve both service delivery and employee experience, including a weekend on-call structure that has enhanced work-life balance not only for her own team, but for multiple offices across Colorado. Her leadership has also influenced the adoption of caregiver support programs, such as lead caregiver and on-call systems, which have strengthened staffing stability and reduced burnout.\n\nBrittani remains closely involved in all aspects of care delivery, from mentoring team members to supporting clients directly when needed. Her background as a caregiver informs her leadership style, fostering a culture where team members feel heard, supported, and empowered to succeed. This approach has contributed to strong relationships with referral partners and consistently positive feedback from caregivers.\n\nBrittani’s impact is rooted in experience, persistence, and a willingness to take ownership at every level of the operation. The systems she has built and the standards she upholds continue to shape not only her own office, but the way others approach care delivery across the organization."}, {"id": "recY7NCKpKBAN0nFy", "name": "Shannon  Loving", "title": "Homecare Supervisor", "company": "Care Advantage Inc", "category": "Operational Excellence", "votes": 35, "reason": "Shannon always goes above and beyond for her clients. She always is patient, making her client's needs come first. She sees their needs & makes sure to advocate for them. She will jump in with ideas, put solutions forward and make them proactively. She cares about all of her clients and wants whats best for them. She doesn't see this as a 8-5 job and will do what it takes to make sure her clients get the best care they need."}, {"id": "rec5eCmqH05kMqCq6", "name": "Katy  Packingham", "title": "Agency Director", "company": "Caring Senior Service in Galesburg, Illinois", "category": "Operational Excellence", "votes": 34, "reason": "Katy Packingham demonstrates operational excellence by turning relationships into results. As Agency Director of Caring Senior Service in Galesburg, Illinois, she has helped reshape the trajectory of the office, more than doubling weekly care hours from just over 450 to more than 1,000 within her first year in a management role.\n\nHer leadership approach is rooted in experience. Having started her career as a caregiver, Katy understands the realities of the role and the importance of building an environment where caregivers feel supported and valued. That perspective carries through in her leadership, where she prioritizes connection, communication, and consistency as the foundation for growth.\n\nKaty’s impact extends beyond internal operations. She has built strong relationships with referral partners, strengthened trust with families, and positioned the Galesburg office as a dependable resource within the local community. Her ability to balance day-to-day operational demands with meaningful relationship-building has allowed the agency to grow in both scale and reputation.\n\nShe is also deeply engaged in the broader senior care landscape, contributing to organizations such as Dementia Friendly Galesburg, the Prairieland Senior Focus Group, the Alzheimer’s Association, and Rotary. Her leadership has been recognized through honors including “The Voice of Caring” and being named one of Galesburg’s Top 5 Under 40 Leaders Making the Greatest Impact for 2025.\n\nKnown for her willingness to step in wherever needed, Katy leads by example. Whether supporting caregivers, working with families, or strengthening community partnerships, she brings a steady, people-first approach that drives both performance and trust.\n\nKaty’s leadership shows that strong operations are built through strong relationships. By investing in her team, her clients, and her community, she has created an environment where growth is not forced, but earned, and where success is shared across everyone involved in the care journey."}, {"id": "recyz9nMB0iIYLN2k", "name": "Sarita Dsouza", "title": "Senior Administrator Coordinator", "company": "Ottawa Home Care Associates Inc.", "category": "Operational Excellence", "votes": 28, "reason": "Sarita, Senior Administrative Coordinator, is a dedicated and highly organized professional who plays a key role in ensuring the smooth day-to-day operations of the organization. With a strong commitment to excellence, she effectively manages scheduling, staff coordination, and administrative processes, ensuring that both clients and team members receive timely and efficient support. Her attention to detail and ability to multitask make her an invaluable part of the team.\n\nSarita is known for her approachable and supportive nature. She fosters a positive work environment by encouraging open communication, teamwork, and mutual respect among staff. She is deeply committed to employee well-being and takes pride in recognizing and appreciating the contributions of her colleagues.\n\nA strong advocate for diversity and inclusion, Sarita ensures that all team members feel valued and respected regardless of their backgrounds. She believes that a diverse and inclusive workplace leads to stronger collaboration and better outcomes for both staff and clients.\n\nThrough her proactive approach, problem-solving skills, and compassionate leadership style, Sarita continues to contribute to a workplace culture that is inclusive, efficient, and people-centered, supporting the organization’s mission of delivering high-quality care and services."}, {"id": "recn8spVU8K8yKYkv", "name": "Melissa Therrien", "title": "General Manager, Alberta & British Columbia", "company": "Ohana Care Health Services", "category": "Operational Excellence", "votes": 23, "reason": "Melissa Therrien is the General Manager of Ohana Care Health Services, a Canadian-owned, non-franchise home care company operating across Alberta and British Columbia. As a Registered Nurse with a Bachelor of Science in Nursing and a Bachelor of Arts, Melissa brings both clinical expertise and strategic business acumen to a role that spans virtually every function of the organization. Over the past three years, she has been the driving force behind Ohana Care’s growth, operational excellence, and reputation as a trusted partner in home-based care for hundreds of clients.\n\nWhy Melissa Deserves This Award\nMulti-Province Operational Leadership\nMelissa oversees all operations across four service regions—Edmonton, Calgary, Vancouver, and Vancouver Island—managing hundreds of caregivers and a full-time administrative team. She has built scalable systems and processes that maintain consistent, high-quality care delivery across two provinces, diverse communities, and growing client demand. Under her leadership, Ohana Care has achieved Accreditation Canada certification, a credential that speaks to the organization’s commitment to safety, quality, and operational rigour.\n\nMeasurable Business Growth\nIn her three years as General Manager, Melissa has driven millions of dollars in annual revenue growth. This wasn’t achieved through aggressive sales tactics—it was built on a foundation of relationship-based care, exceptional client outcomes, and a reputation that generates referrals organically. Families choose Ohana Care and stay with Ohana Care because of the standard Melissa has set.\n\nA True Operational Swiss Army Knife\nWhat sets Melissa apart from most operational leaders is the breadth of her involvement. On any given day, Melissa is working across:\n\n•\tSales and client onboarding – personally handling intake calls, navigating reluctant clients into care, and developing creative solutions for complex family situations\n•\tMarketing and brand building – hosting Ohana Care’s podcast, Caring Conversations, which has produced 12+ episodes educating families on home care topics and positioning Ohana Care as a thought leader\n•\tOperations and scheduling – coordinating care plans, managing caregiver matching, and overseeing 24/7 scheduling support\n•\tHiring and recruitment – working alongside HR to attract, screen, and retain top caregiving talent in a competitive market\n•\tBilling and financial oversight – managing invoicing, navigating Alberta’s Client Directed Home Care Invoicing (CDHCI) program, and ensuring financial sustainability\n•\tExecutive leadership – participating in strategic planning and decision-making with the executive team\n\nShe doesn’t delegate these responsibilities because they’re beneath her—she stays involved because she believes great operations require hands-on leadership at every level.\n\nClient Impact and Reputation\nOhana Care has earned the trust of thousands of clients and accumulated 700+ reviews. Clients and families consistently describe Melissa as knowledgeable, compassionate, and genuinely invested in their well-being. She has championed \n\nOhana Care’s relationship-based care model—one that prioritizes consistent caregiver matching, personalized care plans, and the philosophy that every client should be treated like family. This isn’t a tagline for Melissa; it’s how she operates every day.\n\nHer clinical background as an RN gives her a unique ability to bridge the gap between frontline caregiving and operational decision-making. She understands what caregivers face in the home, and she builds systems that support them rather than adding burden.\n\nEmployee Experience and Culture\nMelissa’s leadership style is proactive, firm, and caring—a combination that has earned deep respect from her team. She sets high expectations but backs them with genuine support, clear communication, and a willingness to roll up her sleeves alongside her staff. Caregivers trust her because she understands their work. Administrative staff rely on her because she leads with clarity and consistency. In an industry plagued by burnout and turnover, Melissa has built a culture where people want to stay and grow.\n\nCommunity and Industry Visibility\nBeyond internal operations, Melissa has raised Ohana Care’s profile through public-facing efforts, such as supporting partnerships with healthcare professionals, hospitals, and community organizations across Alberta and British Columbia. She has positioned Ohana Care as a credible, trusted voice in home-based care—not through self-promotion, but through consistent, values-driven action.\n\nSummary\nMelissa Therrien is not just an operational leader—she is the engine behind Ohana Care’s growth, quality, and culture. She manages two provinces, hundreds of caregivers, and every functional area of the business with a level of dedication that is rare in any industry, let alone one as demanding as home-based care. Her clients trust her. Her employees respect her. And the business results speak for themselves.\n\nIf the Operational Excellence award is meant to recognize someone who elevates every dimension of a home care organization—from the client experience to the caregiver experience to the bottom line—Melissa Therrien is that person."}, {"id": "recmRTXj1np1FQOMh", "name": "Caleb Roseme", "title": "Chief Operations Officer", "company": "Assured Quality Homecare LLC", "category": "Operational Excellence", "votes": 21, "reason": "Caleb Roseme is a systems-focused home care operator whose measurable results, sector-leading workforce programs, and demonstrated policy leadership make him a strong nominee for Operational Excellence and Impact & Innovation within the Home Care industry in Southeastern Connecticut (New London County) and Rhode Island (Kent County / Warwick). \nFirst, he has helped build (and scale) a repeatable workforce engine that directly addresses the industry’s defining constraint—recruitment, training, and retention—through ASQ’s in-house Empower Training Academy and structured certification pathways (Personal Care Aide program (PCA) in Connecticut; CNA training in Rhode Island). ASQ reports that since 2017 it has trained 200+ new home caregivers via its PCA program, and it has developed structured curricula designed to accelerate “career changers” to job readiness within weeks.\nSecond, he has driven technology-enabled operating discipline in a sector often characterized by manual scheduling, inconsistent communication, and reactive staffing.\nThird, he has repeatedly represented Connecticut’s home care sector in formal public testimony and association leadership, including service as Chair of the Home Care Committee and Board Member of the Connecticut Association for Healthcare at Home, advocating for sustainable Medicaid funding and pragmatic regulatory approaches that protect client safety without worsening access gaps during staffing call-outs. \nRoseme’s work is validated by external recognition for ASQ including “Best of Home Care” awards (Home Care Pulse / Activated Insights), national TV feature as a “World’s Greatest!…” home care agency (How2Media), and a Rhode Island accreditation claim via CHAP (Community Health Accreditation Partner)—an accreditation body whose Home Care standards explicitly cover personal care/companion care and emphasize standardized processes and service quality. \nRoseme is helping professionalize home care operations where the stakes are high (frailty, dementia, falls risk, caregiver shortage), and he is building scalable mechanisms—training systems, technology infrastructure, and policy improvements—that make quality more consistent than “heroic effort” alone."}, {"id": "recN9zALeW9n8dW1x", "name": "Sam Pennie", "title": "Operations Manager", "company": "Neighbourly Care", "category": "Operational Excellence", "votes": 19, "reason": "It is my pleasure to nominate Sam Pennie for the Operations Excellence Award in recognition of her outstanding leadership and execution during our recent transition from our legacy system to our new AlayaCare platform.This initiative was both complex and highly impactful for our organization, requiring careful coordination, clear communication, and unwavering attention to detail. Sam demonstrated exceptional operational leadership throughout the process, ensuring the transition completed on time and without disrupting our clients or caregivers.  That achievement reflects her planning capabilities, disciplined execution, and people skills.  Beyond managing timelines and resources, she took full ownership of the operational rollout. She effectively coordinated across teams, ensured accountability at every stage, and proactively addressed challenges before they could impact progress. Her ability to keep all stakeholders aligned and focused was instrumental in the success of this project.Equally notable were her professionalism, patience and composure she brought to the process. System transitions can be stressful and disruptive, yet Sam handled every situation with calm, confidence, and grace. She fostered a sense of stability and trust among team members, which contributed significantly to a smooth and successful implementation.Her leadership not only delivered a critical operational improvement but also strengthened team collaboration and confidence moving forward. The success of this transition directly reflects her dedication, expertise, and commitment to excellence.  As a result, our organization has a fantastic start on the upgraded platform.For these reasons, I strongly recommend Sam Pennie for the Operations Excellence Award."}, {"id": "reczxWh9v9bRBOJ9c", "name": "Magali Dugas", "title": "Agente d’affectation et service clientèle", "company": "Coopérative de services à domicile l'Islet Nord-Sud", "category": "Operational Excellence", "votes": 17, "reason": "Depuis bientôt 5 ans, Mme Magali Dugas se démarque par une implication constante et un dévouement exemplaire envers la Coopérative de services à domicile L’Islet Nord-Sud. \n\nAlliant une rapidité de réponse exceptionnelle à une écoute sincère, elle est devenue un pilier indispensable pour son équipe et la clientèle. Elle cultive naturellement un environnement de travail respectueux et profondément humain. \n\nProfessionnelle, bienveillante et toujours prête à relever les défis, elle incarne une source d’inspiration.\n\nPour son impact positif et son engagement indéfectible, c’est avec une immense fierté que nous appuyons sa candidature pour ce prix. Son travail mérite pleinement cette reconnaissance."}, {"id": "recyihMASdhWj2NBZ", "name": "Lyne Pruneau", "title": "Coordonnatrice principale aux opérations", "company": "Bien Chez Soi Laval Rive-Nord", "category": "Operational Excellence", "votes": 11, "reason": "Je tiens à souligner de façon toute particulière le travail exceptionnel de notre coordonnatrice principale, Lyne Pruneau, qui contribue au succès de Bien Chez Soi Laval Rive-Nord depuis maintenant 4 ans.\n\nAu fil des années, Lyne s’est démarquée par un dévouement hors du commun, une rigueur exemplaire et une qualité de travail remarquable. Son sens de l’organisation, sa capacité à gérer des situations complexes, son souci du détail, sa fiabilité et son professionnalisme font d’elle une ressource absolument essentielle à nos opérations quotidiennes.\n\nDans un domaine comme le nôtre, où la coordination, la communication, la rapidité d’exécution et la fiabilité sont au cœur de la qualité des services offerts à nos clients, son travail fait une différence réelle, concrète et mesurable, chaque jour. Derrière de nombreuses réussites, de nombreux dossiers bien gérés, des horaires optimisés, des situations délicates réglées et des clients bien servis, il y a très souvent le travail discret, mais extrêmement efficace, de Lyne.\n\nLyne est une personne sur qui nous pouvons toujours compter. Elle fait son travail avec sérieux, intelligence, jugement et un grand sens des responsabilités. Elle ne compte pas ses efforts, cherche toujours des solutions et contribue directement à la stabilité, à l’efficacité, à la croissance et à la réputation de qualité de Bien Chez Soi Laval Rive-Nord.\n\nSon engagement envers l’entreprise, son professionnalisme et sa constance dans la qualité de son travail font d’elle un pilier de notre organisation et une collègue extrêmement précieuse."}, {"id": "recjqQxI0qR2qN5F3", "name": "Dana Queen", "title": "Client Care Manager", "company": "Senior Home Share, LLC", "category": "Operational Excellence", "votes": 10, "reason": "I would like to nominate Dana Queen, Client Care Manager at Senior Home Share, for the Operational Excellence Award.\n\nDana consistently demonstrates an exceptional commitment to the seniors we serve. She brings genuine passion and empathy to her role, building meaningful, trusting relationships with clients and their families. Her ability to connect on a personal level ensures that each individual feels heard, valued, and supported.\n\nWhat truly sets Dana apart is her ability to balance this compassionate approach with strong business acumen. She effectively communicates the value of our services and confidently guides families through decision-making, ensuring they receive the care solutions that best meet their needs. This combination of heart and skill makes her an invaluable asset to both our clients and our organization.\n\nDana’s dedication, professionalism, and results-driven mindset embody the very essence of operational excellence. She consistently goes above and beyond, and her impact is felt across every interaction.\n\nFor these reasons, I strongly recommend Dana Queen for this recognition."}, {"id": "rec62dMhlUIXH291b", "name": "Yasmin Mohamoud", "title": "Client Care Coordinator", "company": "The Neighbourhood Group Community Services", "category": "Operational Excellence", "votes": 8, "reason": "I am delighted to nominate Yasmin for this award! In her role as a client care coordinator, she takes on one of the most challenging positions on the team as a \"floater\", supporting multiple teams and stepping in wherever she is needed most.\n\nYasmin play a key role in making sure visits are filled - especially holidays and hard-to-cover stretches. When things are unpredictable, she brings a steady, reliable presence and works persistently to ensure clients continue to receive care without disruption. Her ability to parachute into different teams, quickly understand their needs, and keep things moving speaks to her adaptability and the trusts other placed in her.\n\nShe knows our PSW's preferences, and the realities they are managing on a day to day basis. She connects in a genuine way, and PSWS  and overall efficiently. She also embraces changes in AlayaCare platform and helps others to do the same. Not surprisingly, her peers see her as a leader - and she is often someone they turn to for guidance and support during transitions. \n\nWinsome's impact shows up in stronger operations, a better supported staff, and a seamless experience for our clients. I am grateful for her leadership and delighted to nominate her!"}, {"id": "recQDW858EFEKGwR5", "name": "Grace Nepomuceno", "title": "Operations manager", "company": "Care at Home of Delaware", "category": "Operational Excellence", "votes": 6, "reason": "I am proud to nominate Care at Home of Delaware's Operations Manager for the Operational Excellence Award in recognition of her leadership and impact on our organization.\n\nShe brings structure, accountability, and consistency to complex day-to-day operations, ensuring that scheduling, documentation, and service delivery are accurate and aligned.\n\nOver the past year, she successfully led the onboarding of 200+ caregivers and staff from one EMR to another, ensuring a smooth transition with minimal disruption to services. Her ability to guide both caregivers and staff through change while maintaining operational stability was critical to our success.\n\nWhat sets her apart is her proactive approach: she identifies gaps, implements practical solutions, and helps the team adapt to ongoing changes. She is reliable, solution-oriented, and maintains a high standard of execution.\n\nShe also fosters a positive and supportive environment, balancing accountability with approachability. Her contributions have strengthened our operations and positioned us for continued growth."}, {"id": "recf4IOjzP8o4iry2", "name": "Gabrielle Roy Paquette", "title": "Coordonnatrice service à la clientèle", "company": "Services de soins à domicile", "category": "Operational Excellence", "votes": 5, "reason": "Gabrielle, coordonnatrice service à la clientèle\nBien Chez Soi Aylmer–Pontiac\  en assurant des opérations efficaces tout en plaçant les besoins des personnes au cœur de chaque action"}, {"id": "recvBWAiws2VPeBZM", "name": "Antonio Ignalig", "title": "Supervisor", "company": "Ottawa Home Care Associates Inc.", "category": "Operational Excellence", "votes": 3, "reason": "I would like to nominate Antonio Ignalig, Supervisor at Ottawa Home Care, for the Operational Excellence recognition. Antonio has consistently demonstrated exceptional leadership, reliability, and commitment to ensuring smooth daily operations within the organization.\n\nAs a supervisor, Antonio plays a key role in supporting both administrative staff and care teams by maintaining effective coordination, clear communication, and organized workflow. He approaches his responsibilities with professionalism and a strong sense of accountability, ensuring that tasks are completed efficiently and that operational standards are maintained at all times.\n\nAntonio is known for his proactive attitude and willingness to assist team members whenever needed. He works collaboratively with staff to address challenges, improve processes, and ensure that services are delivered in a timely and organized manner. His ability to manage responsibilities while supporting the team contributes significantly to a productive and positive work environment.\n\nThrough his dedication and strong work ethic, Antonio helps ensure that the organization operates efficiently while maintaining a high level of service for clients and staff. His leadership and commitment to operational improvement make him highly deserving of recognition.\n\nFor his professionalism, teamwork, and dedication to operational excellence, I strongly recommend Antonio Ignalig for the Operational Excellence nomination."}, {"id": "recRxCTQ5dBm0dB0m", "name": "Isar Aeinedar", "title": "Billing Coordinator", "company": "Ottawa Home Care", "category": "Operational Excellence", "votes": 3, "reason": "As CEO, I am pleased to recognize Isar for h
