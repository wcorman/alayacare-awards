ion to delivering exceptional results. Latisa strives to create a positive, organized, and dependable environment where operational standards are not only met but exceeded. This commitment to excellence is reflected in the outcomes we achieve and the trust built with those we serve.\n\n\n\nThank you, Sheila"}, {"id": "recEyOAxCV9vSX9cb", "name": "Becky  Torrez", "title": "President/Owner", "company": "Brightstar Care of W. Central Las Vegas (Henderson and Southwest)", "category": "Operational Excellence", "votes": 0, "reason": "Becky has been leading our team for 13 years now. She is compassionate and caring and loves what we do for the community as a team. She appreciates every person on our team and shows us on a regular basis. Under her leadership we have taken home the clinical excellence award 2 years straight from Corporate and just this quarter we received the following recognition:\n BrightStar Care - NV - Henderson as one of the top home care providers in the nation and earned the following honors: \n•\tBest of Home Care® – Leader in Experience \n•\tBest of Home Care® – Provider of Choice \n•\tBest of Home Care® – Employer of Choice  \nEarning the Leader in Experience award places our agency among a select group of providers nationwide and ranks us in the top 15% of home care businesses participating in the Activated Insights Experience Management Program, an achievement that reflects exceptional performance across both client and employee experience. Our community and clients are well taken care of because she decided to take on this business and lead with care and the desire to make a difference in our client's everyday lives."}, {"id": "recZYrbdHO1Cz2AUE", "name": "Kim Jauerneck", "title": "Scheduling Super User", "company": "Lethbridge Family Services", "category": "Operational Excellence", "votes": null, "reason": "Kim has high energy and motivation to explore how Alayacare systems can improve our client outcomes, as well as collect the best data to be const MAX_PER_CAT = 10;
const CATS = ['Executive Leadership','Frontline Care','Impact and Innovation','Operational Excellence'];
const CAT_CLASS = {'Executive Leadership':'exec','Frontline Care':'front','Impact and Innovation':'innov','Operational Excellence':'ops'};
const CAT_SHORT = {'Executive Leadership':'Executive','Frontline Care':'Frontline','Impact and Innovation':'Innovation','Operational Excellence':'Ops Excellence'};

let selected = JSON.parse(localStorage.getItem('momentumSelected2026') || '{}');
let activeCat = 'Executive Leadership';
let activeId = null;
let sortMode = 'votes';

function save() { localStorage.setItem('momentumSelected2026', JSON.stringify(selected)); }
function catClass(cat) { return CAT_CLASS[cat] || 'exec'; }

function initTabs() {
  const tabs = document.getElementById('categoryTabs');
  tabs.innerHTML = CATS.map(cat => {
    const cls = catClass(cat);
    const selCount = NOMINEES.filter(n => n.category === cat && selected[n.id]).length;
    const complete = selCount >= MAX_PER_CAT;
    return `<button class="tab-btn ${cat === activeCat ? 'active' : ''}" onclick="switchCat('${cat.replace(/'/g,"\'")}')">
      <span class="cat-dot dot-${cls}"></span>${CAT_SHORT[cat]}
      <span class="badge ${complete?'complete':''}">${selCount}/${MAX_PER_CAT}</span>
    </button>`;
  }).join('');
}

function switchCat(cat) {
  activeCat = cat; activeId = null;
  document.getElementById('detailPanel').innerHTML = '<div class="detail-empty"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><p>Select a nominee</p></div>';
  document.getElementById('summaryPanel').classList.remove('visible');
  document.getElementById('detailPanel').style.display = 'block';
  document.getElementById('searchBox').value = '';
  initTabs(); renderList(); updateProgress();
}

function setSort(mode) {
  sortMode = mode;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sort' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
  renderList();
}

function getSorted() {
  let list = NOMINEES.filter(n => n.category === activeCat);
  const q = document.getElementById('searchBox').value.toLowerCase();
  if (q) list = list.filter(n => n.name.toLowerCase().includes(q) || n.company.toLowerCase().includes(q) || n.title.toLowerCase().includes(q));
  if (sortMode === 'alpha') list.sort((a,b) => a.name.localeCompare(b.name));
  else if (sortMode === 'selected') list.sort((a,b) => (selected[b.id]?1:0)-(selected[a.id]?1:0));
  else list.sort((a,b) => (b.votes||0)-(a.votes||0));
  return list;
}

function renderList() {
  const list = getSorted();
  const selCount = NOMINEES.filter(n => n.category === activeCat && selected[n.id]).length;
  const bar = document.getElementById('selectedCountBar');
  if (selCount > 0) {
    bar.style.display = 'flex';
    bar.innerHTML = `<span>&#11088; ${selCount} of ${MAX_PER_CAT} selected</span><span style="color:var(--text-muted);font-size:10px">${MAX_PER_CAT-selCount} spots left</span>`;
  } else { bar.style.display = 'none'; }
  document.getElementById('sidebarCatLabel').textContent = activeCat;
  document.getElementById('nomineeList').innerHTML = list.map(n => {
    const isSel = !!selected[n.id];
    const cls = catClass(n.category);
    const vHigh = n.votes !== null && n.votes >= 50;
    return `<div class="nominee-item ${n.id === activeId ? 'active' : ''} ${isSel ? 'selected-item' : ''}" onclick="showDetail('${n.id}')">
      <div class="nominee-item-name">${n.name}</div>
      <div class="nominee-item-sub">${n.title} &middot; ${n.company}</div>
      <div class="nominee-item-meta">
        <span class="votes-pill ${vHigh?'high':''}">${n.votes !== null ? '&#9650; '+n.votes : '&mdash;'}</span>
        <div class="check-mark">${isSel ? '&#10003;' : ''}</div>
      </div>
    </div>`;
  }).join('');
}

function showDetail(id) {
  activeId = id;
  const n = NOMINEES.find(x => x.id === id);
  if (!n) return;
  const isSel = !!selected[id];
  const cls = catClass(n.category);
  const initials = n.name.trim().split(/\s+/).map(w=>w[0]||'').filter(Boolean).slice(0,2).join('').toUpperCase();
  const catSelCount = NOMINEES.filter(x => x.category === n.category && selected[x.id]).length;
  const atLimit = catSelCount >= MAX_PER_CAT && !isSel;
  const vHigh = n.votes !== null && n.votes >= 50;
  const list = getSorted();
  const idx = list.findIndex(x => x.id === id);
  const prevId = idx > 0 ? list[idx-1].id : null;
  const nextId = idx < list.length-1 ? list[idx+1].id : null;
  document.getElementById('summaryPanel').classList.remove('visible');
  const dp = document.getElementById('detailPanel');
  dp.style.display = 'block';
  dp.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div class="nav-arrows">
        <button class="nav-arrow" onclick="showDetail('${prevId}')" ${!prevId?'disabled':''}>&#8592;</button>
        <button class="nav-arrow" onclick="showDetail('${nextId}')" ${!nextId?'disabled':''}>&#8594;</button>
      </div>
      <span style="font-size:11px;color:var(--text-muted)">${idx+1} of ${list.length}</span>
    </div>
    ${atLimit ? '<div class="limit-warning">&#9888; Category full (10/10). Deselect a nominee first.</div>' : ''}
    <div class="detail-header">
      <div class="detail-avatar avatar-${cls}">${initials}</div>
      <div class="detail-info">
        <div class="detail-name">${n.name}</div>
        <div class="detail-title-company"><strong>${n.title}</strong> &middot; ${n.company}</div>
        <div class="detail-tags">
          <span class="cat-tag cat-${cls}">${n.category}</span>
          ${n.votes !== null
            ? `<span class="votes-tag ${vHigh?'high':''}">&#9650; ${n.votes} public votes</span>`
            : '<span class="no-ballot-tag">Not on public ballot</span>'}
        </div>
      </div>
      <button class="detail-select-btn ${isSel?'selected':''}" onclick="toggleSelect('${id}')" ${atLimit?'disabled style="opacity:.4;cursor:not-allowed"':''}>
        ${isSel ? '&#10003; Selected' : '+ Select'}
      </button>
    </div>
    <hr class="detail-divider">
    <div class="section-label">Nomination Statement</div>
    <div class="nomination-text">${escHtml(n.reason)}</div>
  `;
  renderList();
}

function toggleSelect(id) {
  const n = NOMINEES.find(x => x.id === id);
  if (!n) return;
  if (selected[id]) { delete selected[id]; }
  else {
    const catCount = NOMINEES.filter(x => x.category === n.category && selected[x.id]).length;
    if (catCount >= MAX_PER_CAT) { alert('Max 10 per category. Please deselect one first.'); return; }
    selected[id] = true;
  }
  save(); initTabs(); renderList(); updateProgress();
  if (activeId === id) showDetail(id);
}

function updateProgress() {
  const total = CATS.length * MAX_PER_CAT;
  const done = Object.keys(selected).length;
  const pct = (done / total * 100).toFixed(1);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCount').textContent = `${done} / ${total} selected`;
  document.getElementById('progressLabel').textContent = `${pct}% complete`;
}

function showSummary() {
  document.getElementById('detailPanel').style.display = 'none';
  const sp = document.getElementById('summaryPanel');
  sp.classList.add('visible');
  const totalSel = Object.keys(selected).length;
  sp.innerHTML = `
    <div class="summary-header">
      <img class="summary-logo" src="${LOGO_SRC}" alt="AlayaCare">
      <div class="summary-header-text">
        <h2>Selection Summary</h2>
        <p>${totalSel} nominee${totalSel!==1?'s':''} selected &middot; Home-Based Care Momentum Awards 2026</p>
      </div>
    </div>
    ${CATS.map(cat => {
      const cls = catClass(cat);
      const picks = NOMINEES.filter(n => n.category === cat && selected[n.id]).sort((a,b) => (b.votes||0)-(a.votes||0));
      return `<div class="summary-category">
        <div class="summary-cat-title">
          <span class="summary-cat-dot dot-${cls}"></span>${cat}
          <span style="font-size:12px;color:var(--text-muted);font-weight:400">${picks.length}/${MAX_PER_CAT}</span>
        </div>
        ${picks.length === 0
          ? '<div class="empty-cat">No nominees selected in this category yet</div>'
          : picks.map((n,i) => `<div class="summary-nominee-row">
              <div class="summary-rank">${i+1}</div>
              <div class="summary-nominee-info">
                <div class="summary-nominee-name">${n.name}</div>
                <div class="summary-nominee-sub">${n.title} &middot; ${n.company}</div>
              </div>
              <div class="summary-votes">${n.votes !== null ? '&#9650; '+n.votes : '&mdash;'}</div>
              <button onclick="toggleSelect('${n.id}');showSummary()" style="background:rgba(243,112,33,.12);border:1px solid rgba(243,112,33,.3);color:var(--orange);padding:5px 11px;border-radius:5px;cursor:pointer;font-size:11px;font-family:'Inter',Arial,sans-serif">Remove</button>
            </div>`).join('')}
      </div>`;
    }).join('')}
    <div class="export-section">
      <button class="btn btn-orange" onclick="exportCSV()">&#11015; Export as CSV</button>
      <button class="btn btn-ghost" onclick="hideSummary()">&#8592; Back to Nominees</button>
    </div>
  `;
}

function hideSummary() {
  document.getElementById('summaryPanel').classList.remove('visible');
  document.getElementById('detailPanel').style.display = 'block';
}

function clearAll() {
  if (!confirm('Clear all selections?')) return;
  selected = {}; save(); initTabs(); renderList(); updateProgress();
  document.getElementById('detailPanel').innerHTML = '<div class="detail-empty"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><p>Select a nominee to get started</p></div>';
}

function exportCSV() {
  const rows = [['Category','Name','Job Title','Company','Public Votes']];
  CATS.forEach(cat => {
    const picks = NOMINEES.filter(n => n.category === cat && selected[n.id]).sort((a,b) => (b.votes||0)-(a.votes||0));
    picks.forEach(n => rows.push([cat, n.name, n.title, n.company, n.votes !== null ? n.votes : '']));
  });
  const csv = rows.map(r => r.map(c => '"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  try {
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'momentum_awards_2026_selections.csv';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  } catch(e) { showExportModal(csv); }
}

function showExportModal(csv) {
  const existing = document.getElementById('exportModal');
  if (existing) existing.remove();
  const modal = document.createElement('div');
  modal.id = 'exportModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  modal.innerHTML = `
    <div style="background:#0e2350;border:1px solid #1e3d7a;border-radius:12px;padding:24px;max-width:680px;width:100%;max-height:80vh;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3 style="color:#f37021;font-size:18px;font-weight:700">Export Selections</h3>
        <button onclick="document.getElementById('exportModal').remove()" style="background:none;border:none;color:#5a7499;font-size:18px;cursor:pointer">&#10005;</button>
      </div>
      <p style="color:#a8bcd8;font-size:12px">Copy below and paste into a <strong style="color:#fff">.csv file</strong> or Excel / Google Sheets.</p>
      <textarea id="csvText" readonly style="flex:1;min-height:280px;background:#08193e;border:1px solid #1e3d7a;border-radius:7px;padding:12px;color:#fff;font-family:monospace;font-size:11px;resize:none;outline:none">${csv}</textarea>
      <div style="display:flex;gap:8px">
        <button onclick="document.getElementById('csvText').select();document.execCommand('copy');this.textContent='&#10003; Copied!';setTimeout(()=>this.textContent='Copy to Clipboard',2000)" style="flex:1;padding:10px;background:#f37021;color:#fff;border:none;border-radius:7px;font-family:'Inter',Arial,sans-serif;font-weight:700;font-size:13px;cursor:pointer">Copy to Clipboard</button>
        <button onclick="document.getElementById('exportModal').remove()" style="padding:10px 18px;background:rgba(255,255,255,.07);border:1px solid #1e3d7a;color:#a8bcd8;border-radius:7px;font-family:'Inter',Arial,sans-serif;font-size:13px;cursor:pointer">Close</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

initTabs(); renderList(); updateProgress();
</script>
</body>
</html>
