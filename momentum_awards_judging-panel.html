<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momentum Awards — Judge Panel 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --orange:#f37021;--orange-light:#f58220;--logo-blue:#101A5C;
  --vivid-blue:#113cca;--light-blue:#1d5eed;--deep-blue:#08193e;
  --bg:#08193e;--surface:#0e2350;--surface2:#132a5e;--surface3:#1a3470;
  --border:#1e3d7a;--text:#ffffff;--text-dim:#a8bcd8;--text-muted:#5a7499;
  --selected:rgba(243,112,33,0.15);
  --exec:#1d5eed;--exec-bg:rgba(29,94,237,0.2);
  --front:#f37021;--front-bg:rgba(243,112,33,0.2);
  --innov:#ffaa05;--innov-bg:rgba(255,170,5,0.2);
  --ops:#5feae6;--ops-bg:rgba(95,234,230,0.2);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.header{background:linear-gradient(135deg,#08193e 0%,#101A5C 60%,#0a1535 100%);border-bottom:2px solid var(--orange);padding:0 28px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:20px;height:64px}
.header-logo-img{height:32px;object-fit:contain;flex-shrink:0}
.header-divider{width:1px;height:36px;background:rgba(255,255,255,0.15);flex-shrink:0}
.header-award-title{font-size:13px;font-weight:700;color:white;letter-spacing:.3px;white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.header-award-title span{font-size:10px;font-weight:400;color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase}
.header-tabs{display:flex;gap:3px;flex:1;overflow-x:auto}
.tab-btn{padding:6px 14px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text-dim);cursor:pointer;font-family:'Inter',Arial,sans-serif;font-size:12px;font-weight:500;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab-btn .cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tab-btn:hover{background:var(--surface2);color:var(--text)}
.tab-btn.active{background:var(--surface2);color:var(--text);border-color:var(--border)}
.tab-btn .badge{background:rgba(255,255,255,.1);color:white;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700}
.tab-btn.active .badge.complete{background:var(--orange);color:#fff}
.header-actions{display:flex;gap:6px;flex-shrink:0}
.btn{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-family:'Inter',Arial,sans-serif;font-size:12px;font-weight:600;transition:all .15s}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--text-dim);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-orange{background:var(--orange);color:#fff}
.btn-orange:hover{background:var(--orange-light)}
.progress-bar-wrap{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 28px;display:flex;align-items:center;gap:14px}
.progress-label{font-size:11px;color:var(--text-dim);white-space:nowrap}
.progress-track{flex:1;height:3px;background:var(--surface3);border-radius:2px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--vivid-blue),var(--orange));border-radius:2px;transition:width .4s}
.progress-count{font-size:11px;color:var(--orange);font-weight:700;white-space:nowrap}
.layout{display:flex;height:calc(100vh - 96px);overflow:hidden}
.sidebar{width:320px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto}
.sidebar-header{padding:14px 14px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;background:var(--surface)}
.sidebar-header h3{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;font-weight:600}
.search-box{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 11px;color:var(--text);font-family:'Inter',Arial,sans-serif;font-size:12px;outline:none}
.search-box::placeholder{color:var(--text-muted)}
.search-box:focus{border-color:var(--orange)}
.sidebar-sort{display:flex;gap:4px;margin-top:6px}
.sort-btn{flex:1;padding:4px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text-dim);cursor:pointer;font-size:10px;font-family:'Inter',Arial,sans-serif;font-weight:500;transition:all .12s}
.sort-btn.active,.sort-btn:hover{background:var(--surface3);color:var(--text);border-color:var(--orange)}
.nominee-item{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:all .12s}
.nominee-item:hover{background:var(--surface2)}
.nominee-item.active{background:var(--surface2);border-left:3px solid var(--orange)}
.nominee-item.selected-item{background:var(--selected)}
.nominee-item.selected-item.active{background:rgba(243,112,33,.22);border-left-color:var(--orange)}
.nominee-item-name{font-weight:600;font-size:12px;color:var(--text);margin-bottom:2px}
.nominee-item-sub{font-size:10px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nominee-item-meta{display:flex;align-items:center;gap:6px;margin-top:5px}
.votes-pill{display:inline-flex;align-items:center;gap:3px;background:var(--surface3);border-radius:10px;padding:2px 7px;font-size:10px;color:var(--text-dim);font-weight:500}
.votes-pill.high{color:var(--orange);background:rgba(243,112,33,.15)}
.check-mark{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .15s;flex-shrink:0;margin-left:auto}
.nominee-item.selected-item .check-mark{background:var(--orange);border-color:var(--orange);color:#fff}
.selected-count-bar{padding:7px 14px;background:rgba(243,112,33,.1);border-bottom:1px solid rgba(243,112,33,.25);font-size:11px;color:var(--orange);font-weight:500;display:flex;align-items:center;justify-content:space-between}
.detail-panel{flex:1;overflow-y:auto;background:var(--bg);padding:28px 36px}
.detail-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);flex-direction:column;gap:12px;text-align:center}
.detail-empty svg{opacity:.15}
.detail-header{display:flex;align-items:flex-start;gap:18px;margin-bottom:24px}
.detail-avatar{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0;letter-spacing:-1px}
.detail-info{flex:1}
.detail-name{font-size:24px;font-weight:700;color:var(--text);line-height:1.2;margin-bottom:5px}
.detail-title-company{font-size:14px;color:var(--text-dim);margin-bottom:9px}
.detail-title-company strong{color:var(--text)}
.detail-tags{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.cat-tag{padding:3px 10px;border-radius:16px;font-size:11px;font-weight:600}
.votes-tag{padding:3px 10px;border-radius:16px;font-size:11px;font-weight:600;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim)}
.votes-tag.high{color:var(--orange);border-color:rgba(243,112,33,.4);background:rgba(243,112,33,.1)}
.no-ballot-tag{padding:3px 9px;border-radius:16px;font-size:10px;background:rgba(255,255,255,.05);color:var(--text-muted);border:1px solid var(--border)}
.detail-select-btn{padding:10px 22px;border-radius:8px;border:2px solid var(--orange);background:transparent;color:var(--orange);cursor:pointer;font-family:'Inter',Arial,sans-serif;font-size:13px;font-weight:700;transition:all .15s;white-space:nowrap;flex-shrink:0}
.detail-select-btn:hover{background:rgba(243,112,33,.1)}
.detail-select-btn.selected{background:var(--orange);color:#fff}
.detail-select-btn.selected:hover{background:var(--orange-light)}
.detail-divider{border:none;border-top:1px solid var(--border);margin:20px 0}
.section-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;font-weight:600}
.nomination-text{color:var(--text-dim);line-height:1.75;font-size:13px;white-space:pre-wrap;word-break:break-word;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 22px}
.limit-warning{background:rgba(243,112,33,.12);border:1px solid rgba(243,112,33,.3);border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:12px;color:var(--orange);display:flex;align-items:center;gap:9px}
.nav-arrows{display:flex;gap:4px}
.nav-arrow{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.nav-arrow:hover{background:var(--surface3);color:var(--text)}
.nav-arrow:disabled{opacity:.3;cursor:not-allowed}
.summary-panel{display:none;flex:1;overflow-y:auto;padding:28px 36px;background:var(--bg)}
.summary-panel.visible{display:block}
.summary-header{margin-bottom:28px;display:flex;align-items:center;gap:16px}
.summary-header-text h2{font-size:26px;font-weight:700;color:var(--text);margin-bottom:4px}
.summary-header-text p{color:var(--text-dim);font-size:13px}
.summary-logo{height:28px;object-fit:contain}
.summary-category{margin-bottom:32px}
.summary-cat-title{font-size:16px;font-weight:700;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.summary-cat-dot{width:10px;height:10px;border-radius:50%}
.summary-nominee-row{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.summary-rank{width:26px;height:26px;border-radius:50%;background:var(--orange);color:#fff;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.summary-nominee-info{flex:1}
.summary-nominee-name{font-weight:600;font-size:13px}
.summary-nominee-sub{font-size:11px;color:var(--text-dim);margin-top:2px}
.summary-votes{font-size:11px;color:var(--text-muted);margin-right:8px}
.empty-cat{padding:16px;background:var(--surface);border:1px dashed var(--border);border-radius:8px;color:var(--text-muted);text-align:center;font-size:12px}
.export-section{margin-top:28px;padding-top:20px;border-top:1px solid var(--border);display:flex;gap:10px}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}
.cat-exec{color:var(--exec);background:var(--exec-bg)}
.cat-front{color:var(--front);background:var(--front-bg)}
.cat-innov{color:var(--innov);background:var(--innov-bg)}
.cat-ops{color:var(--ops);background:var(--ops-bg)}
.dot-exec{background:var(--exec)}.dot-front{background:var(--front)}.dot-innov{background:var(--innov)}.dot-ops{background:var(--ops)}
.avatar-exec{background:var(--exec-bg);color:var(--exec);border:1.5px solid rgba(29,94,237,.4)}
.avatar-front{background:var(--front-bg);color:var(--front);border:1.5px solid rgba(243,112,33,.4)}
.avatar-innov{background:var(--innov-bg);color:var(--innov);border:1.5px solid rgba(255,170,5,.4)}
.avatar-ops{background:var(--ops-bg);color:var(--ops);border:1.5px solid rgba(95,234,230,.4)}
</style>
</head>

<script>
const NOMINEES = [{"id": "recndotTdToImw0y9", "name": "HENRY LUKENGE", "title": "CEO and President", "company": "Nexim Healthcare Consultants LTD", "category": "Executive Leadership", "votes": 292, "reason": "As  president and CEO and NEXIM HEALTHCARE CONSULTANTS INC; I helped NHCI from a small start up over the last 15 years into one of Canada's leading healthcare work force planning and staffing solutions provider including but not limited - obtaining quality control accreditation by accreditation canada,   providing services in 3 provinces  and the United Kingdom and winning multiple service excellence awards along the way."}, {"id": "recUlJeu443hAhbXD", "name": "Michael Nappi", "title": "Chief Operating Officer", "company": "Outreach Health", "category": "Executive Leadership", "votes": 108, "reason": "Michael Nappi is an accomplished executive leader whose work is helping redefine how home care organizations grow, lead, and deliver care in an increasingly complex environment. With more than two decades of multi-site and multi-state leadership experience, he brings a rare combination of strategic vision, operational discipline, and people-centered leadership to one of healthcare’s fastest-growing sectors.\n\nAs Chief Operating Officer of Outreach Health he supports more than 4,500 caregivers and thousands of clients, across three states. Michael is responsible for driving operational performance, workforce strategy, and sustainable growth across multiple markets. At a time when the home care industry faces unprecedented workforce shortages and rising demand for services, his leadership has focused on building scalable systems, empowering local leaders, and strengthening the operational infrastructure necessary to support reliable, high-quality care in the home.\n\nMichael has helped shape a strategic approach that aligns growth with accountability. By strengthening leadership structures, improving operational consistency across markets, and reinforcing clear standards for quality and compliance, he has ensured that expansion is paired with strong oversight and measurable performance. His ability to translate strategy into practical execution has enabled teams across the organization to operate with greater clarity, efficiency, and confidence.\n\nEqually important is Michael’s unwavering commitment to investing in people. He believes that exceptional home-based care begins with empowered teams and supported caregivers. Through mentorship, leadership development, and a culture that values transparency and collaboration, he has helped cultivate leaders across the organization who are equipped to navigate the challenges of delivering care in the home while maintaining a strong connection to the organization’s mission.\n\nMichael’s leadership reflects a broader vision for the future of home-based care; one where organizations scale thoughtfully, invest deeply in their workforce, and build operational models capable of meeting the growing needs of aging and vulnerable populations. By combining strategic leadership, operational excellence, and a culture that prioritizes both caregivers and clients, Michael Nappi is helping shape a stronger, more resilient future for home-based care."}, {"id": "rechJ3gjrG0BoCxZn", "name": "Jackie Fox", "title": "Owner/CEO", "company": "Senior Home Share", "category": "Executive Leadership", "votes": 48, "reason": "I am honored to nominate our Owner and CEO Jackie Fox for the Executive Leadership Award. Her leadership is defined by integrity, generosity, and an unwavering commitment to doing what is right. She consistently demonstrates honesty and transparency in every decision, earning the trust and respect of both staff and clients alike.\n\nWhat truly sets her apart is her people-first approach. She prioritizes the well-being of both clients and caregivers, ensuring that care is not only high-quality but also compassionate and respectful. She understands that exceptional service begins with supporting those who deliver it, and she actively foster an environment where caregivers feel valued, heard, and empowered.\n\nIn addition, she is a strong advocate for teamwork. She leads by example, encouraging collaboration and unity across all levels of the organization. Whether facing challenges or celebrating successes, she brings people together and reinforce a shared sense of purpose. Her willingness to step in and help whenever needed—regardless of the task—demonstrates humility and a genuine commitment to the team.\n\nJackie's leadership inspires excellence, builds trust, and creates a culture where both employees and clients thrive. For these reasons, I strongly believe she is a deserving recipient of the Executive Leadership Award."}, {"id": "recBRE0juvoX957Hy", "name": "Ayeshia Quainoo - Tefera", "title": "Owner", "company": "Ultimate Care", "category": "Executive Leadership", "votes": 26, "reason": "Ayeshia Quainoo Tefera exemplifies what it means to lead with heart in the home care industry. For nine years, she has built and sustained The Ultimate Care LLC, not just as a business, but as a community where caregivers are valued, supported, and invested in.\n\nWhat sets Ayeshia apart is her unwavering commitment to her team of over 140 staff members. In an industry where caregiver turnover is high and benefits are rare, Ayeshia has made the intentional choice to reinvest profits back into her people. She offers healthcare coverage at 60%, 401(k) retirement plans, and paid time off, benefits that many home care agencies don't provide, especially smaller ones navigating tight margins.\n\nEven when facing financial challenges, Ayeshia never cuts corners on her caregivers. She stands alongside them, leading by example with compassion and resilience. Her philosophy is simple: take care of the people who take care of others.\n\nAyeshia's leadership proves that running a successful care agency and treating caregivers with dignity aren't mutually exclusive, they're inseparable. She deserves recognition not just for what she's built, but for how she's built it: with care, love, and an unshakable belief in the people who make it all possible."}, {"id": "recOTAWMWpEHMAmy9", "name": "Sandra Beauchamp", "title": "Présidente directrice", "company": "Services de soins à domicile", "category": "Executive Leadership", "votes": 15, "reason": "Candidature – Agent de changement en leadership de la direction\nSandra, Présidente-Directrice de la franchise\nBien Chez Soi Aylmer–Pontiac\nPrésentation : Sandra, propriétaire et Présidente-Directrice de Bien Chez Soi Aylmer–Pontiac depuis juin 2024 se distingue par son leadership proactif, créatif et profondément humain. Toujours à la recherche de solutions innovantes, elle optimise les opérations tout en valorisant et en mobilisant son équipe. Sa capacité à déléguer, à encourager les forces de chacun et à maintenir un environnement collaboratif unique fait d’elle une leader inspirante et accessible.\nContributions clés :\n•\tGestion des opérations et ressources humaines : Embauche et accompagnement du personnel, planification des horaires, suivi personnalisé des employés, mise en place de documents et procédures pour structurer les services et réduire les erreurs. \n•\tSoutien et développement des équipes : Rencontres régulières, formation continue, implantation des nouveautés AlayaCare, bilans hebdomadaires et activités de cohésion. \n•\tDéveloppement local et régional : Multiples partenariats et visites auprès de municipalités, cliniques, pharmacies et organismes communautaires, notamment : la Maison des Collines (soins palliatifs), la Société Alzheimer Outaouais, Action santé Outaouais, la Fondation québécoise du cancer, et les mairies de Chelsea et Gatineau. Ces actions ont augmenté l’accessibilité et la visibilité des services dans toute la région.\n\nLeadership et impact :\n•\tInnovation et créativité : Trouve des solutions adaptées aux défis opérationnels et aux besoins spécifiques des clients et employés, assurant un service optimal. \n•\tEmpathie et relation client : Rencontre chaque famille avant le début des services pour écouter et rassurer, offrant un suivi personnalisé et attentif. \n•\tVisibilité et influence : Participation active à des associations professionnelles et initiatives locales (RFAQ, APICA, CCG, Cercle des femmes d’impact), contribuant au développement de la franchise et au rayonnement du secteur.\n\n•\tOptimisation des processus et procédures, réduisant les erreurs et augmentant l’efficacité opérationnelle. \n•\tEngagement et mobilisation du personnel renforcés par un leadership positif et valorisant. \n•\tDéveloppement de partenariats locaux et régionaux, augmentant la portée des services et la satisfaction des clients. \n•\tPrésence médiatique et actions de visibilité, renforçant la notoriété et la crédibilité de la franchise dans l’Outaouais.\nSandra incarne le leadership visionnaire et humain. Par son action stratégique, son empathie, sa créativité et son engagement à valoriser son équipe, elle contribue directement à l’amélioration continue des soins à domicile, au succès de la franchise et au rayonnement du secteur dans la région."}, {"id": "recrkzDfqvWvx2kFP", "name": "Courtney Segars", "title": "Vice President, Operations", "company": "Care at Home of Delaware", "category": "Executive Leadership", "votes": 12, "reason": "Courtney is a thoughtful leader who emphasizes collaboration, cohesion, and innovation. It is a pleasure working with her to modernize our agency without compromising integrity and the human connection."}, {"id": "recFxZ1pwbWIJA2mz", "name": "Catherine Morgan", "title": "Directrice, Propriétaire", "company": "Bien Chez Soi Deux-Montagnes, Mirabel", "category": "Executive Leadership", "votes": 9, "reason": "Au début, c’est moi qui allais visiter chaque client et leur prodiguais des soins avec bienveillance. Aujourd’hui, je me consacre davantage au développement de mes secteurs. Toutefois, je prends toujours le temps de faire des appels à mes clients ainsi qu’à mes bienveillantes.\n\nJe m’assure d’offrir une qualité de service irréprochable à mes clients et je veille à ce que mes aides-soignants se sentent bien dans leur travail.\n\nPrendre soin des gens est essentiel pour moi."}, {"id": "recXiZzp5w4F3zBbV", "name": "Veerpal Dhatt", "title": "Founder/Director", "company": "YYC Home Care Services", "category": "Executive Leadership", "votes": 5, "reason": "I am honoured to nominate the founder of YYC Home Care Services, Veerpal Dhatt, for excellence in Leadership. Through strategic foresight, and a deep commitment to patient-centered care, she has redefined what high-quality home care looks like in Calgary.\n\nWith her paramedic-led home care model, she has elevated safety standards, strengthened oversight, and built a culture rooted in dignity, accountability, and compassion. Her leadership goes beyond operations, she actively mentors caregivers, fosters continuous improvement, and ensures that every client receives care that is backed by health care and culture. \n\nBringing in frontline experience, she has created a company that prioritizes both community impact and team development. Her unwavering dedication to improving outcomes, supporting families, and empowering healthcare professionals makes her an exceptional and deserving candidate for recognition in Executive Leadership."}, {"id": "recwAQAzIYxYAdFtP", "name": "Shilonda Savage", "title": "CEO", "company": "Mother's Heart Homecare", "category": "Executive Leadership", "votes": 4, "reason": "I am nominating myself as an executive leader in home care because this work is not just professional—it is deeply personal and purpose-driven.\n\nMy parents had me later in life, so I witnessed their aging in a very real and immediate way. When my father became ill, my mother cared for him until his passing. Nearly 20 years later, she began to decline due to dementia and Alzheimer’s. I then watched my sister step into the role of primary caregiver, and I saw firsthand the emotional and physical toll that responsibility takes on a family.\n\nWe did everything we could to support one another. But eventually, we reached a point where we had no choice but to place my mother in a facility—where, unfortunately, the quality of care did not reflect the dignity she deserved.\n\nThat experience shaped my leadership.\n\nIt gave me a clear mission: to help families avoid that outcome whenever possible. Through my work in home care, I am committed to preserving the legacy of caring for our seniors within their homes and communities—where they can receive compassionate, one-on-one support in an environment that feels safe, familiar, and respectful.\n\nAs a leader, I am not only building a business—I am building a standard of care rooted in dignity, trust, and accountability.\n\nIf I can help even one family navigate this journey with more support, more options, and better care than we had, then I know I am making the impact I was called to make."}, {"id": "recW1aYxUPjcDXlC9", "name": "Amanda Jennings", "title": "Senior staffing coordinator", "company": "Delta Homecare", "category": "Executive Leadership", "votes": 2, "reason": "For nearly eight years, I have served as the Senior Staffing Coordinator at a home health agency, demonstrating unwavering dedication to both patients and caregivers. In a role that requires constant problem-solving, organization, and compassion, I  consistently go above and beyond to ensure that vulnerable patients receive the care they need.\nI am the backbone of daily operations , balancing complex schedules, responding to last-minute challenges, and making sure every patient has a qualified caregiver when they need one most. My ability to manage chaos with professionalism and heart has made me a valuable part of the team.\nI am highly committed to people. I advocate for caregivers, support families during difficult times, and work tirelessly behind the scenes to keep the entire system running smoothly. My reliability, leadership, and compassion embody the spirit of excellence that the Home Base Care Monument Award represents.\nThrough years of dedication, resilience, and genuine care for others, I have made a lasting impact on my organization and the lives of the patients and families it serves. I feel I am highly deserving of recognition for the difference i make every single day."}, {"id": "recArZCOQxf7FKD1J", "name": "Justyn King", "title": "VP of Operations", "company": "Connect Pediatrics", "category": "Executive Leadership", "votes": 2, "reason": "With nearly 15 years of experience in home-based care, I have built my career around expanding access, strengthening operations, and supporting sustainable growth for medically complex children and their families. As Vice President of Operations, since joining my organization in 2023, I have helped lead 40% year-over-year organic growth and successfully launched operations in two additional states. My leadership has focused on creating scalable infrastructure, improving workflows, strengthening staffing support, and developing high-performing teams that can deliver quality care consistently across growing markets. I am proud to lead with a mission-first mindset that balances strategic growth with compassionate service, helping ensure more children and families can access the care they need in the home."}, {"id": "recDjd0TGf0f17jPx", "name": "Lindsey Klebenow", "title": "Owner", "company": "Heart to Heart Home Care & Adult Day Center", "category": "Executive Leadership", "votes": 2, "reason": "Lindsey Klebenow’s story doesn’t begin with a title or an award—it begins with a little girl, just nine years old, learning how to care for her grandmother on a remote island where help didn’t exist. There were no resources, no guidance—just love, resilience, and a determination to figure things out together. That experience didn’t just shape her childhood; it quietly built the foundation for the woman she would become.\n\nYears later, Lindsey carried that same determination with her to Montana, where she attended Montana State University. While earning her bachelor’s degree in Community Health with a minor in Gerontology, she didn’t just study caregiving—she lived it. She became a CNA and an EMT, working hands-on in assisted living, memory care, and eventually home care. It was never just a job to her; it was a calling that had started long before she even knew what to call it.\n\nBut Lindsey didn’t stop there. While continuing her work in home care, she took a leap that few would dare—she became a business owner. At the same time, she was accepted into the prestigious USC School of Gerontology. Over the next three years, she balanced running a company, completing her master’s degree, and welcoming a new baby into her life. Where most would feel overwhelmed, Lindsey pressed forward with quiet strength and unwavering purpose.\n\nAfter graduating, she saw a gap in care that needed to be filled—and she acted. She purchased a commercial building and created something Montana had never seen before: the state’s first standalone adult day center. Not only that, she worked to pave the way for the VA to authorize adult day services separately from respite care, opening doors for countless families. Today, that vision is thriving.\n\nAnd still, she wasn’t finished.\n\nLindsey went on to found the Montana Gerontology Foundation, a nonprofit dedicated to providing financial support for elderly individuals living with disabilities and dementia across the state. In true Lindsey fashion, she didn’t think small—she organized a major benefit concert featuring country artist Jay Allen to raise funds and awareness, turning compassion into action on a grand scale.\n\nYet, through all of this, Lindsey remains grounded in what matters most. She is, above all, an incredible mother and a devoted wife. Her love and unwavering support for her husband, who lives with a traumatic brain injury, reflect the same compassion she brings to every part of her life. No matter how much she takes on, she never wavers in her commitment to her family.\n\nDespite everything she has accomplished, Lindsey remains humble, kind, and deeply empathetic. She carries herself with integrity that is rare—honest, genuine, and as solid as a Montana handshake. She may be constantly balancing more than most people could imagine, but she does it with grace and heart.\n\nLindsey Klebenow doesn’t just lead—she inspires. And she is more than deserving of every bit of recognition that comes her way."}, {"id": "recqbN33hkXnq9b1k", "name": "Jenna Skeen", "title": "CEO", "company": "Loved Ones In Home Care", "category": "Executive Leadership", "votes": 1, "reason": "Jenna Skeen exemplifies the highest standards of executive leadership in her role as CEO of Loved Ones In Home Care, a trusted in-home health care provider that has served families for nearly 30 years. Her leadership honors a powerful legacy while driving the organization forward with vision, compassion, and operational excellence.\n\nAs a second-generation leader, Jenna stepped into the role of CEO following the passing of her mother, Donna Skeen, in November 2021. In a moment marked by both personal loss and organizational transition, Jenna demonstrated extraordinary strength and resolve. She not only carried forward her mother’s mission of compassionate, client-centered care but also ensured stability and continuity for employees, clients, and the broader community during a profoundly emotional time.\n\nUnder Jenna’s leadership, Loved Ones In Home Care has continued to uphold its reputation for exceptional service while adapting to the evolving demands of the health care industry. She combines strategic foresight with hands-on operational insight, ensuring compliance, quality assurance, caregiver support, and client satisfaction remain at the forefront of the company’s priorities. Her ability to balance regulatory excellence, financial stewardship, and compassionate service delivery is a testament to her executive capability.\n\nJenna leads with heart as well as discipline. She understands that in-home care is deeply personal work—built on trust, empathy, and reliability. She has strengthened caregiver development, reinforced a culture of accountability and kindness, and fostered a team environment where employees feel valued and empowered. Her leadership ensures that families receive not just services, but genuine support and dignity for their loved ones.\n\nWhat makes Jenna especially deserving of the Momentum Award is her ability to steward a legacy while accelerating growth and forward progress. She transformed a time of grief into renewed purpose—expanding services, strengthening operations, and positioning the company for continued success in a competitive and evolving healthcare landscape. By honoring the strong foundation her mother built and propelling it into its next chapter, she has created meaningful momentum that will carry the organization confidently into the future.\n\nFor her resilience, strategic vision, operational excellence, and unwavering dedication to compassionate care, Jenna Skeen is profoundly deserving of the Momentum Award. Her leadership not only preserves a legacy—it propels it forward."}, {"id": "recN03Q77CN7bSMc4", "name": "Alicia Reid", "title": "Director", "company": "Starpoint Home Care", "category": "Executive Leadership", "votes": 1, "reason": "As the Director of Starpoint Home Care, I lead with a commitment to compassion, accountability, and innovation that sets our agency apart in the non-medical home care field. What distinguishes our team is our focus on truly individualized care—going beyond basic assistance to build meaningful relationships with every client and family we serve. I prioritize hiring and developing caregivers who share our mission of dignity, reliability, and respect, while implementing systems that ensure consistent communication, quality oversight, and rapid response to client needs. Under my leadership, our agency emphasizes meeting care standards but exceeding them by  trust, cultural sensitivity, and community connection. This dedication to both our clients and our caregivers creates an environment where families feel supported, caregivers feel valued, and the quality of care delivered by Starpoint Home Care consistently rises above what is right when running a home care."}, {"id": "receUQ5KwSg911BTH", "name": "Benoit Goupil", "title": "Propriétaire / PDG", "company": "Bien Chez Soi Laval Rive-Nord", "category": "Executive Leadership", "votes": 1, "reason": "Soulignons le travail, la vision et l’engagement de Benoit Goupil, PDG de Bien Chez Soi Laval Rive-Nord, qui depuis maintenant 9 ans développe, opère et gère la franchise avec rigueur, constance et détermination.\n\nAu fil des années, Benoit a su bâtir bien plus qu’une entreprise : il a mis en place une organisation solide, structurée et reconnue pour la qualité de ses services, son professionnalisme et sa fiabilité. Par son leadership, sa capacité à prendre des décisions, à gérer la croissance, à structurer les opérations et à maintenir des standards élevés, il a contribué à faire de Bien Chez Soi Laval Rive-Nord une référence en soins et soutien à domicile dans la région.\n\nDiriger une entreprise dans notre domaine demande une présence constante, une grande capacité d’adaptation, une gestion serrée des opérations, des ressources humaines, des finances, du développement et des relations avec les clients et partenaires. Depuis 9 ans, Benoit assume toutes ces responsabilités avec sérieux, vision et sens des responsabilités.\n\nDerrière la croissance de l’entreprise, les milliers d’heures de services rendus, les familles aidées, les emplois créés et la réputation de qualité de l’organisation, il y a des années de travail, de décisions difficiles, de gestion quotidienne et d’amélioration continue.\n\nSon engagement envers la qualité des services, la stabilité de l’organisation, le bien-être des clients/employés et le développement de l’entreprise mérite d’être souligné et reconnu."}, {"id": "recXYSIQvFUBUmZ73", "name": "Cedrick Spears", "title": "CEO", "company": "Spears Home Care", "category": "Executive Leadership", "votes": null, "reason": "It is with deep respect and genuine admiration that I nominate Dr. Cedrick Spears for Executive Leadership recognition. Dr. Spears is not simply a business owner he is a servant leader whose life’s work centers around protecting dignity, restoring hope, and ensuring that no senior or vulnerable adult feels forgotten. As the CEO of Quality Personal Care, he has dedicated himself to serving elderly individuals, veterans, and families navigating some of the most difficult seasons of their lives.\n\nIn an industry where margins can easily overshadow mission, Dr. Spears has remained steadfast in choosing people over profit. He consistently makes decisions rooted in compassion, long-term stability, and ethical responsibility even when those decisions require personal sacrifice or slower growth. His leadership is deeply selfless. He has invested countless hours strengthening operational systems, building accountability structures, and formalizing governance not for recognition, but to ensure families receive consistent, high-quality care they can trust. \nHis focus on structure and sustainability is driven by one simple belief: vulnerable families deserve excellence, not shortcuts.\n\nDr. Spears leads from the front, but he never seeks the spotlight. He empowers his team, challenges them to grow, and holds leadership accountable including himself. He believes that true executive leadership is not about authority, but stewardship. Every policy he implements, every performance structure he designs, and every expansion decision he evaluates is measured against one question: “Does this protect our clients and strengthen our caregivers?”\n\nHis commitment to veterans and underserved populations further reflects his heart for service. He understands that many of the individuals he serves have given so much in their own lives to their families, their communities, and their country and he believes it is our responsibility to care for them with honor. Dr. Spears has transformed Quality Personal Care from a small home care agency into a growing, structured organization grounded in accountability and compassion. But what makes him most deserving of Executive Leadership recognition is not just the growth it is the integrity behind it.\n\nHe leads with faith.\nHe leads with humility.\nHe leads with courage.\nAnd most importantly, he leads with selflessness.\n\nFor his unwavering dedication to ethical growth, community impact, and dignified care for those who need it most, Dr. Cedrick Spears is truly deserving of Executive Leadership recognition."}, {"id": "recDardbOjL3z6f2g", "name": "Jeff Zuckerman", "title": "President", "company": "Family and Nursing Care", "category": "Executive Leadership", "votes": null, "reason": "Jeff Zukerman exemplifies executive leadership in home based care through sustained growth, operational excellence, and a deep commitment to older adults and their families. As President of Family and Nursing Care, he oversees client services, caregiver operations, business development, marketing, communications, and human resources, while leading expansion into new markets including Pennsylvania in 2024 and New Jersey in 2025.\n\nWith more than 25 years in elder care, Jeff has helped grow the organization to serve tens of thousands of older adults and build a network of more than 1,500 caregivers. Under his leadership, the company has earned multiple Best of Bethesda honors and a Circle of Excellence award, with 98 percent of clients saying they would recommend the organization.\n\nJeff brings a service driven mindset shaped by his background in hospitality and senior living, fostering a culture centered on quality, accountability, and compassionate care."}, {"id": "recX7tMe0iQoUM1Zk", "name": "Yelena Schmidt", "title": "President & CEO", "company": "Friends & Family", "category": "Executive Leadership", "votes": null, "reason": "Yelena Schmidt leads in home based care with empathy shaped by personal experience. Having watched all of her grandparents receive home care services, including hospice support, she witnessed firsthand the profound impact compassionate caregivers can have on families. One aide remains part of her family to this day, a testament to the lasting bonds formed through quality care.\n\nThose experiences guide Yelena’s leadership every day. She makes decisions through the lens of a family member, understanding both the emotional and practical realities of care. She believes strong leadership requires resilience, openness to feedback, and the ability to unite teams through shared purpose.\n\nIn an industry often defined by regulatory complexity and constant change, Yelena stands out not only as a young female leader but as one grounded in compassion. She believes home care is not simply a service, but a human responsibility. Her commitment to empathy, accountability, and people first decision making defines her impact."}, {"id": "recNGKNRy53u9ensp", "name": "Sofia Yagudaev", "title": "CEO", "company": "Boulevard Home Care", "category": "Executive Leadership", "votes": null, "reason": "Sofia Yagudaev exemplifies executive leadership through vision, operational excellence, and community impact. As President of Operations and a founding leader of Boulevard Home Care Associates, she has transformed the organization from a start up into a state of the art home care provider serving several thousand patients across New York in less than four years.\n\nWith more than 15 years in healthcare, Sofia has driven strategic growth, process improvement, and team development while strengthening partnerships with regulators, insurers, physicians, and community organizations. Under her leadership, Boulevard expanded its geographic footprint, broadened services, and was selected as one of only 13 agencies awarded the ability to function as a Fiscal Intermediary statewide.\n\nInspired by her grandmother, a three time cancer survivor, Sofia leads with compassion and a deep commitment to helping families navigate the healthcare system. Recognized as one of New York City’s Leading Female Entrepreneurs under 30, she continues to elevate patient experience while giving back through community education and charitable initiatives."}, {"id": "receFC7bXadYn7JKR", "name": "Millen Rastogi", "title": "CEO", "company": "UniversaCare", "category": "Executive Leadership", "votes": null, "reason": "Millen is nominated for his forward-thinking approach to integrating artificial intelligence into the fabric of daily operations at Universa Care. As CEO, he has proactively embraced AI tools to streamline workflows, enhance team communication, and improve decision-making across the organization — recognizing early that technology, when thoughtfully deployed, amplifies human capability rather than replacing it. His initiative to leverage AI for employee engagement, operational efficiency, and patient care coordination reflects both strategic vision and a genuine commitment to those his organization serves.\nWhat sets Millen apart is that his drive for innovation never loses sight of people. He leads with a customer-first and employee-first philosophy, ensuring that every technology adoption is evaluated through the lens of how it improves the experience of both the patients who depend on Universa Care and the dedicated staff who deliver that care. In an industry where human connection is everything, Millen has shown that AI and compassion are not competing forces — they are complementary ones."}, {"id": "recr0JHJqJwIce42d", "name": "Kristy Rohwedder", "title": "Chief Operating Officer", "company": "Aveanna", "category": "Executive Leadership", "votes": null, "reason": "Excellent leadership!"}, {"id": "recyElFa8L3qqFffX", "name": "Kristian Vizcarra", "title": "Chief Executive Officer", "company": "Healthcare Plus", "category": "Executive Leadership", "votes": null, "reason": "Motivating and excellent leadership"}, {"id": "rec3dQS9m791IS6uP", "name": "Elibel Fernandez", "title": "Director", "company": "Joy Home Care", "category": "Executive Leadership", "votes": null, "reason": "Strong leadership and support."}, {"id": "recctup2xFrpUcA1H", "name": "Alison  Green", "title": "Présidente", "company": "Bien Chez Soi", "category": "Executive Leadership", "votes": null, "reason": "Alison Green est une figure clé du développement et du rayonnement des soins à domicile au Québec. Fondatrice engagée, elle agit comme ambassadrice du continuum de santé pour les aînés et les personnes en perte d’autonomie.\n\nÀ travers la création de l’ASDQ, elle contribue à structurer et faire entendre la voix de l’industrie, tant dans l’espace public que médiatique et auprès des instances gouvernementales. Son implication a notamment participé à faire avancer la politique « Mieux chez soi », renforçant la reconnaissance du maintien à domicile comme pilier du système de santé.\n\nSon leadership s’exprime aussi à l’interne. Alison favorise la croissance des membres de son équipe et encourage l’émergence de leaders, notamment chez les femmes. Elle accompagne également le développement de 28 entrepreneurs franchisés, en misant sur la confiance, l’autonomie et le développement du plein potentiel.\n\nPar son approche à la fois humaine et structurante, Alison contribue à transformer durablement le rôle des soins à domicile au Québec, en les positionnant comme un levier essentiel de qualité de vie et de continuité des soins."}, {"id": "recpvNpvTWIl4aLN2", "name": "Lisa  Conway", "title": "VP of Care Services", "company": "One Senior Place", "category": "Executive Leadership", "votes": null, "reason": "Lisa is an extremely knowledgeable and  :\n\nDepuis près de 27 ans, Mme Doris Joncas, se démarque par une implication constante et un dévouement exemplaire envers la Coopérative de services à domicile L’Islet Nord-Sud en y exerçant autant des tâches d'aide à la vie quotidienne que domestique.\n\nIl est possible de lui attribuer plusieurs qualités, créant l'admiration de ses collègues: dévouée, généreuse, altruiste, aimable, attachante, toujours souriante et prête à aider ceux dans le besoin.\n\nCombinant plusieurs années d'expérience ainsi que plusieurs formations, Mme Joncas fait preuve d'une assiduité et d'une débrouillardise hors pair. Elle est devenue un pilier pour son équipe et au sein de la clientèle. Toujours prête à aider lorsque le besoin se ressent, elle remplace dès que cela lui est possible, en plus d'être très polyvalente. Sa disponibilité face à son travail est remarquable et les suivis qu'elle y exerce sont un atout considérable pour notre Coopérative.  À travers son travail respectueux, bienveillant et profondément humain, elle apporte une aide indispensable à la clientèle. Professionnelle et toujours prête à relever les défis, elle incarne une source d’inspiration pour toute personne la connaissant.\n\nPour son impact positif et son engagement constant et remarquable, nous proposons avec une immense fierté sa candidature pour ce prix. Son travail et la personne qu'elle est méritent pleinement cette reconnaissance."}, {"id": "recj6PIkKnG8SEi0Y", "name": "Unna Fuller-Fletcher", "title": "Director of Operations", "company": "Service in Your City Healthcare Placement Service", "category": "Frontline Care", "votes": 48, "reason": "We are proud to nominate Unna Fuller-Fletcher for recognition in Front Line Care within Canada’s healthcare industry. Ann consistently demonstrates exceptional dedication, compassion, and leadership in delivering high-quality patient care. Her commitment to advocating for patients, supporting families, and collaborating with multidisciplinary teams exemplifies the very best of frontline healthcare practice.\n\nUnna approaches every patient interaction with empathy and professionalism, ensuring individuals feel heard, respected, and supported during some of their most vulnerable moments. She is known among colleagues for her calm presence in high-pressure situations, her willingness to mentor new staff, and her unwavering focus on safety and quality improvement.\n\nBeyond her clinical responsibilities,  Unna actively contributes to strengthening healthcare delivery by identifying process improvements, promoting evidence-based practices, and fostering a culture of teamwork and accountability. Her integrity, resilience, and patient-first mindset reflect the core values of Canada’s healthcare system.\n\nFor her outstanding service, tireless commitment, and meaningful impact on patients and colleagues alike, Unna Fuller- Fletcher is highly deserving of recognition in Front Line Care within the Canadian healthcare industry."}, {"id": "recX1F91mRpuEyJcI", "name": "Jamilla Mansoor", "title": "Founder", "company": "Soleful Harmony", "category": "Frontline Care", "votes": 48, "reason": "I am nominating myself for the Home-Based Care Momentum Awards in the changemakers in Frontline Care category because my work is rooted in direct, hands-on clinical care delivered where it matters most: in clients’ homes and community settings across Calgary and surrounding areas.\n\nI am a Licensed Practical Nurse (LPN) and the Founder and sole operator of Soleful Harmony, a mobile foot care service designed for people who face real barriers to accessing clinic-based care—especially individuals living with diabetes, circulation concerns, mobility limitations, arthritis/autoimmune conditions, poor eyesight, and complex health needs. Many of my clients are older adults or medically vulnerable individuals who would otherwise delay care until a small issue becomes an infection, ulcer, or hospitalization risk. My goal is simple and urgent: prevent complications, protect dignity, and improve quality of life—one visit at a time.\n\nFrontline impact: safety, outcomes, and dignity in the home.\nIn home-based care, trust and safety are everything. I bring clinical-grade, evidence-based foot care directly to clients in their preferred setting—private homes, hospitals, senior care facilities, and community spaces—while maintaining a standard of infection prevention that reflects my nursing training and commitment to best practice. I perform lower limb assessments, provide education, and deliver skilled foot care services including nail care and debridement of corns/calluses when clinically appropriate. Each appointment is structured, thorough, and client-centred, with a strong focus on comfort, consent, and respectful communication.\n\nMy clients choose mobile care because it reduces stress, transportation barriers, and physical strain—especially for those with pain, limited mobility, or chronic illness. I consistently hear that what stands out is not only the convenience, but the way I treat the whole person: calm, compassionate, and clinically confident, while explaining findings in clear language and supporting families/caregivers with practical education.\n\nRaising the bar: hospital-grade infection control in a mobile model\nI have invested heavily—financially and professionally—in delivering safe care in non-traditional environments. I follow recognized standards (AHS/CLPNA and professional foot care best practices) and use a Health Canada/AHS-approved autoclave to ensure sterilization and infection control processes meet a high clinical threshold. I maintain sterilization and maintenance logs and use clean/dirty transport systems to protect clients, families, and facilities I enter.\n\nThis level of rigor is not always expected in mobile services—but I believe it should be. My work helps reduce preventable complications and supports safer aging-in-place for clients who deserve high-quality care without sacrificing dignity or safety.\n\nMomentum through leadership, education, and representation\nBeyond direct care, I contribute to momentum in home-based care through education and community presence. I have served as a guest speaker and panel participant for Black History Month, using my lived experience and professional expertise to support representation, culturally competent care, and meaningful dialogue in healthcare spaces. I bring a perspective grounded in frontline reality: what clients need, what families struggle with, and what systems can do better to support care in the home.\n\nRecognition and credibility\nMy work has been recognized through industry/community acknowledgement, including being a Canadian Choice Award winner for Foot Care Services – Calgary (2026). This recognition reflects not only service quality, but the trust I’ve built with clients who often feel overlooked or rushed in traditional settings.\n\nWhy I’m a fit for Changemakers in Frontline Care\nHome-based care is built on small moments that add up to life-changing impact—showing up reliably, noticing early warning signs, educating with patience, and delivering skilled care with compassion. That is exactly what I do. I create momentum by:\n- Improving client comfort, mobility, and confidence through consistent, skilled foot care\n- Supporting prevention for high-risk clients (especially those with diabetes/circulation concerns)\n- Bringing hospital-grade infection control and professionalism into the home setting\n- Treating every client with dignity, warmth, and person-centred respect\n- Extending my impact through education, speaking, and community leadership\n\nI’m proud to represent frontline caregivers who build trust in living rooms, bedrooms, and community spaces—quietly preventing complications and helping people stay safe at home."}, {"id": "rec3tLhepTZ67hHDh", "name": "Marie-Ève  St-Pierre", "title": "Préposée aux services", "company": "Coopérative de services à domicile l'Islet Nord-Sud", "category": "Frontline Care", "votes": 29, "reason": "Depuis plus de 10 ans, Marie-Ève St-Pierre a à cœur la mission de la Coopérative de services à domicile l’Islet Nord-Sud.\n\nElle s’investie pour le maintien à domicile et a pour mission d’améliorer la qualité de vie des gens de sa région. L’écoute, l’intégrité, le sens des responsabilités, la rigueur, la discrétion et la confidentialité, sont des valeurs qui transparaissent dans son quotidien. \n\nQue ce soit en effectuant un service de répit, en offrant des soins ou dans ses échanges avec les divers intervenants, ses interventions se démarquent par un professionnalisme, un respect et une assiduité hors pair. Son implication dans les comités, les suivis qu’elle effectue pour la clientèle et les compétences qu’elle détient font d’elle un atout indispensable pour le bien-être de sa communauté.\n\nHumaine et polyvalente, on peut sans aucune gêne affirmer qu’elle est un modèle à suivre dans son métier.\n\nPour son impact positif et son engagement constant et remarquable, nous proposons avec une immense fierté sa candidature pour ce prix. Son travail et la personne qu'elle est méritent pleinement cette reconnaissance."}, {"id": "recnsQwlTxipwKjKE", "name": "Sharon Burton-Young", "title": "CEO/Director, Clinical Nurse Manager", "company": "Gracious Heart Nursing Services, LLC", "category": "Frontline Care", "votes": 25, "reason": "In 2015 Sharon-Burton Young founded Gracious Heart Nursing Services, LLC with a clear and heartfelt mission \"Delivering specialized nursing care with compassion\" and \"Gracious Heart Staff does it with Hearts.\" This guiding principle continues to shape the company's culture and commitment to excellence. Sharon journey in healthcare started at a young age, receiving her Bachelor of Science in Nursing from the University of Delaware in 1988 and over 40years of nursing experience and more than two decades of which have been dedicate to homecare. Sharon has worked in many fast-paced environments, including the Intensive Care Unit (ICU), Coronary Care Unit (CCU) and Emergency Department (ED). These experiences equipped her with extensive clinical expertise, critical thinking skills, and leadership capabilities that now empower her to guide her nursing staff at Gracious Heart in delivering high-tech nursing care with EXCELLENCE. Under Sharon's leadership, Gracious Heart Nursing Services has partnered with a variety of specialty pharmacies and licensed prescribers to ensure seamless, coordinated care for thousands of patients receiving infusion therapy in the comfort of their homes. The patients served by the organization represent a wide range of diagnoses for which infusion services are an essential component of treatment. As a hands-on leader Sharon takes pride in educating and working alongside of her team (28 register nurses and 4 administrative professionals). Sharon leads by example, never asking more of her staff than she is willing to give herself, by remaining accessible and actively involved, fosters a culture of unwavering passion, accountability and shared purposed. Sharon is a true meaning of a TRAILBLAZER!!!"}, {"id": "recboW6DMvJ2uAJvM", "name": "Mehwish Bashir", "title": "CEO/Founder", "company": "MyWish Healthcare Solutions", "category": "Frontline Care", "votes": 18, "reason": "MyWish Homecare Solutions is dedicated to delivering compassionate, client-centered frontline care that allows seniors to age safely and with dignity in the comfort of their own homes. Our Personal Support Workers provide hands-on assistance with personal care, dementia support, respite services, and 24/7 care across the Niagara Region.\n\nWhat sets us apart is not just the services we provide, but the heart behind them. We treat every client like family, ensuring respect, cultural sensitivity, and individualized care plans tailored to each person’s unique needs.\n\nIn a time when families are navigating complex healthcare transitions, MyWish has stepped forward to bridge care gaps, support overwhelmed caregivers, and provide reliable, professional home-based care. Our commitment to quality, safety, and compassion reflects the true meaning of frontline excellence.\n\nWe believe exceptional home care is not just a service, it is a responsibility to our community."}, {"id": "reco1AURXznhcRaPq", "name": "Daniel Flaherty", "title": "Home Care Supervisor, RN", "company": "Care Advantage Inc", "category": "Frontline Care", "votes": 14, "reason": "Dan is always putting his clients first. He explains company rules and the client handbook thoroughly. He has a great rapport with his clients and they can depend on him to be his normal caring self. His clinical paperwork is nearing flawless. He is always willing to help with promoting of Care Advantage. Vocal in stand-up and IDT meetings. He is the epitome of our iCARE values."}, {"id": "recqiipJ7v9BMom9j", "name": "Shweta Jeet SHANGARI", "title": "Owner & Operations Manager", "company": "BrightStarCare Acton/Andover & Lowell", "category": "Frontline Care", "votes": 6, "reason": "BrightStar Care Acton/Andover & Lowell is proud to be eligible for the Frontline Care Award because our team consistently delivers exceptional, 5-star–rated care to some of the most medically complex and vulnerable individuals in our community—while leading with compassion, resilience, and genuine heart.\n\nSupported by a dedicated team of 80+ licensed nurses and professional caregivers, our frontline staff provides round-the-clock, hospital-level care at home across 12+ towns. We care for clients facing advanced cancer, Stage 3 and 4 pressure ulcers, hospice needs, ALS, Parkinson’s disease, dementia, and other highly complex conditions that demand advanced clinical expertise, emotional strength, and unwavering dedication. These are not routine cases—yet our team shows up every day and night to ensure safety, dignity, comfort, and continuity of care, allowing clients to heal and live with dignity in the place they call home.\n\nWhat truly sets BrightStar Care apart is not just clinical excellence, but how deeply we care. Our nurses and caregivers treat every client like their own family, taking the time to listen, comfort, advocate, and stand beside families during their most difficult moments. We don’t just provide care—we build trust, bring comfort, and become a source of strength when families need it most. Families frequently tell us, “You were a godsend,” and “You helped us through our hardest time,” affirming the life-changing impact of our frontline team.\n\nBeyond direct care, BrightStar Care is deeply committed to giving back and strengthening the Boston-area community. We actively invest in community well-being by offering free educational series on topics such as AI, technology, and fall-risk prevention; free health check-up clinics including blood pressure and diabetes screenings; community wellness programs; and free yoga and wellness events. These initiatives are designed to empower families with knowledge, confidence, and resources, helping them stay informed, proactive, and supported.\n\nOur mission goes beyond caring for people in crisis—we strive to improve overall community health, safety, and quality of life. Through compassion, clinical excellence, tireless frontline dedication, and meaningful community involvement, BrightStar Care Acton/Andover & Lowell exemplifies the true spirit of frontline care and is honored to be considered for this award.\n\nWebsite: https://www.brightstarcare.com/locations/acton-andover-lowell/\n\nCommunity Impact & Free Programs:\nhttps://www.brightstarcare.com/locations/acton-andover-lowell/about-us/blog/caring-beyond-the-home-how-brightstar-care-tewksbury-is-educating-empowering-our-local-community/"}, {"id": "recToCUwnrAfvoRXn", "name": "Emmanuel Boursiquot", "title": "Payroll Assistant", "company": "Ottawa Home Care Associates Inc.", "category": "Frontline Care", "votes": 3, "reason": "I would like to nominate Emmanuel, Payroll Assistant at Ottawa Home Care, for the Operational Excellence recognition. Emmanuel has demonstrated exceptional dedication, accuracy, and professionalism in managing payroll-related responsibilities, ensuring that staff members are paid correctly and on time.\n\nIn his role as Payroll Assistant, Emmanuel plays a critical part in maintaining the efficiency and reliability of payroll operations. He carefully manages payroll processing, reviews timesheets, and ensures that records are accurate and compliant with organizational policies. His attention to detail and commitment to accuracy help prevent discrepancies and maintain trust among employees.\n\nEmmanuel is also known for his strong organizational skills and his willingness to assist both staff and management when payroll-related questions or concerns arise. He approaches his work with patience, professionalism, and a solution-oriented mindset, ensuring that issues are resolved promptly and efficiently.\n\nThrough his consistent reliability and commitment to high standards, Emmanuel contributes significantly to the smooth functioning of administrative operations. His work supports both employees and management by ensuring that payroll processes remain organized, transparent, and dependable.\n\nFor his dedication, precision, and commitment to operational efficiency, I strongly recommend Emmanuel for the Operational Excellence nomination."}, {"id": "recII68iDnaJh3MvP", "name": "Marie  Charles", "title": "Bienveillante", "company": "Bien chez Soi Aylmer-Pontiac", "category": "Frontline Care", "votes": 3, "reason": "Marie se distingue par sa fiabilité exemplaire, son professionnalisme et son attention remarquable aux détails. Toujours ponctuelle et disponible, elle offre des soins constants et de grande qualité, ce qui se reflète directement dans la satisfaction des clients — plusieurs demandent même à augmenter leurs services avec elle.\nSon engagement se manifeste concrètement lorsqu’elle a su détecter un c
